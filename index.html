<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFE PAY — CRM</title>
<style>
:root{
 --bg:#e9f4ff;--bg2:#f7fbff;--panel:rgba(255,255,255,.66);--panel2:rgba(255,255,255,.45);
 --text:#0a1a2f;--muted:#5d7characteristic;--muted:#5d708d;--line:rgba(30,105,180,.15);
 --blue:#118dff;--cyan:#16d7ff;--purple:#7047ff;--green:#16c99a;--red:#ff5570;--yellow:#f2b72f;
 --shadow:0 18px 60px rgba(20,91,155,.14);--sidebar:rgba(255,255,255,.55);
 --table:rgba(255,255,255,.5);--input:rgba(255,255,255,.72);--r:22px;
}
html[data-theme=dark]{
 --bg:#04101f;--bg2:#07182e;--panel:rgba(14,33,61,.66);--panel2:rgba(11,28,52,.5);
 --text:#eef7ff;--muted:#93a9c6;--line:rgba(130,200,255,.16);
 --shadow:0 22px 70px rgba(0,0,0,.42);--sidebar:rgba(6,22,43,.7);
 --table:rgba(6,22,43,.5);--input:rgba(6,22,43,.62);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,'Segoe UI',Arial,sans-serif;color:var(--text);
 background:linear-gradient(140deg,var(--bg),var(--bg2));min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(120,170,230,.4);border-radius:9px}

/* ── живой фон ── */
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:-1;pointer-events:none}
.b1{width:520px;height:520px;left:-160px;top:-140px;background:radial-gradient(circle,#00b0ff,transparent 65%);animation:drift 22s ease-in-out infinite}
.b2{width:480px;height:480px;right:-140px;top:-90px;background:radial-gradient(circle,#7047ff,transparent 65%);animation:drift 28s ease-in-out infinite reverse}
.b3{width:420px;height:420px;left:38%;bottom:-220px;background:radial-gradient(circle,#16d7ff,transparent 65%);animation:drift 26s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,40px) scale(1.12)}66%{transform:translate(-40px,60px) scale(.94)}}

/* ── анимации ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.93) translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 2px rgba(17,141,255,.25))}50%{filter:drop-shadow(0 0 16px rgba(17,141,255,.6))}}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes barGrow{from{height:0!important;opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ringIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateX(40px) scale(.96)}to{opacity:1;transform:none}}
@keyframes rippleGo{to{transform:scale(2.6);opacity:0}}
@keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}
.anim{animation:fadeUp .55s cubic-bezier(.2,.8,.25,1) both}
.anim-pop{animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both}

.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(26px) saturate(150%);
 -webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:var(--shadow)}
.card{border-radius:var(--r);padding:18px;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-3px);box-shadow:0 26px 70px rgba(20,91,155,.2)}

/* ── логотип ── */
.logo{width:140px;display:block;color:#0b1930;animation:floatY 6s ease-in-out infinite,glowPulse 4.5s ease-in-out infinite}
.logo svg{width:100%;height:auto;display:block}
html[data-theme=dark] .logo{color:#fff}

/* ── логин ── */
#login{min-height:100vh;display:grid;place-items:center;padding:28px}
.login-card{width:min(460px,100%);padding:34px;border-radius:30px;animation:pop .6s cubic-bezier(.2,.9,.3,1.15) both;position:relative;overflow:hidden}
.login-card:after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 4.5s ease-in-out infinite}
.login-card h1{font-size:32px;margin:22px 0 6px}
.login-card p{color:var(--muted);margin:0 0 22px;line-height:1.5}
.field{display:grid;gap:7px;margin:14px 0}
.field label{font-size:12.5px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);
 background:var(--input);outline:none;transition:border-color .2s,box-shadow .2s,transform .2s}
.field textarea{min-height:78px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(17,141,255,.13)}
.primary{position:relative;overflow:hidden;border:0;border-radius:14px;padding:13px 18px;color:#fff;font-weight:800;
 background:linear-gradient(100deg,#087cff,#16c6ff);box-shadow:0 12px 28px rgba(0,126,255,.28);transition:transform .2s,box-shadow .2s}
.primary:hover{transform:translateY(-2px);box-shadow:0 18px 38px rgba(0,126,255,.36)}
.primary:active{transform:translateY(0)}
.primary.block{width:100%}
.primary[disabled]{opacity:.6;cursor:not-allowed;transform:none}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rippleGo .6s ease-out forwards;pointer-events:none}
.error{min-height:20px;color:var(--red);font-size:12.5px;margin-top:10px;white-space:pre-wrap;word-break:break-word}
.hintbox{margin-top:14px;padding:11px 13px;border-radius:13px;background:rgba(17,141,255,.09);
 border:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.55}

/* ── каркас ── */
#app{display:grid;grid-template-columns:238px 1fr 340px;min-height:100vh}
.sidebar{padding:20px 14px;background:var(--sidebar);border-right:1px solid var(--line);
 backdrop-filter:blur(30px);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side-logo{padding:8px 8px 22px}
.side-logo .logo{width:126px}
.nav{display:grid;gap:6px;position:relative}
.nav button{border:1px solid transparent;background:transparent;padding:11px 13px;border-radius:14px;
 text-align:left;font-weight:650;display:flex;align-items:center;gap:11px;transition:.25s;font-size:14px}
.nav button i{font-style:normal;width:20px;text-align:center;opacity:.8}
.nav button:hover{background:rgba(17,141,255,.1);transform:translateX(3px)}
.nav button.active{background:linear-gradient(100deg,rgba(10,130,255,.96),rgba(22,198,255,.8));color:#fff;
 box-shadow:0 12px 26px rgba(17,141,255,.3);transform:translateX(3px)}
.nav button.active i{opacity:1}
.userbox{margin-top:auto;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);
 display:flex;gap:10px;align-items:center;animation:fadeUp .6s .2s both}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
 background:linear-gradient(145deg,#0c8cff,#4a3dff);color:#fff;font-weight:800;flex:none;box-shadow:0 8px 20px rgba(17,141,255,.35)}
.userbox b{font-size:13px;display:block}
.userbox .small{font-size:11.5px;color:var(--muted);word-break:break-word}

.main{padding:20px 24px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;animation:fadeUp .5s both}
.top h2{margin:0;font-size:26px;letter-spacing:-.4px}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.search{margin-left:auto;width:min(320px,32vw);border:1px solid var(--line);background:var(--input);
 border-radius:14px;padding:11px 14px;outline:none;transition:.25s}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(17,141,255,.12);width:min(380px,40vw)}
.iconbtn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--panel);
 flex:none;transition:.25s;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px) rotate(-6deg)}
.iconbtn.spin{animation:spin .7s linear}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kpi{position:relative;overflow:hidden;padding:17px}
.kpi:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-38px;top:-44px;
 background:var(--kc,rgba(17,141,255,.16));transition:transform .4s}
.kpi:hover:after{transform:scale(1.35)}
.kpi .muted{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi b{display:block;font-size:31px;margin-top:6px;letter-spacing:-1px}
.kpi .tag{font-size:11px;color:var(--muted);margin-top:2px}

/* ── графики ── */
.chartgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.cardhead b{font-size:15px}
.mini{font-size:11.5px;color:var(--muted)}
.chart{height:180px;display:flex;align-items:flex-end;gap:10px;padding:14px 4px 4px;
 background:linear-gradient(180deg,rgba(17,141,255,.06),transparent);border-radius:16px}
.bar{flex:1;max-width:54px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,#19ccff,#1673ff);
 box-shadow:0 8px 22px rgba(18,140,255,.28);animation:barGrow .9s cubic-bezier(.2,.9,.3,1) both;transition:filter .2s}
.bar:hover{filter:brightness(1.18)}
.donutwrap{display:flex;align-items:center;gap:24px;height:180px}
.donut{width:152px;height:152px;border-radius:50%;position:relative;flex:none;animation:ringIn .7s cubic-bezier(.2,.9,.3,1.2) both}
.donut:after{content:"";position:absolute;inset:30px;border-radius:50%;background:var(--bg2);box-shadow:inset 0 0 22px rgba(0,0,0,.14)}
.donut b{position:absolute;z-index:1;inset:0;display:grid;place-items:center;font-size:24px}
.legend{display:grid;gap:12px;font-size:13px}
.legend span{display:flex;gap:9px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:#13c8ff;flex:none;box-shadow:0 0 10px currentColor}
.dot.b{background:#187bff}.dot.p{background:#7047ff}.dot.g{background:#16c99a}.dot.r{background:#ff5570}

/* ── таблицы ── */
.tablewrap{overflow:auto;border-radius:16px;border:1px solid var(--line);max-height:58vh}
table{width:100%;border-collapse:collapse;background:var(--table);font-size:12.2px}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:700;background:rgba(120,180,255,.09);position:sticky;top:0;z-index:1;backdrop-filter:blur(10px);cursor:pointer;user-select:none}
th:hover{color:var(--blue)}
tbody tr{cursor:pointer;animation:fadeIn .4s both;transition:background .2s}
tbody tr:hover td{background:rgba(17,141,255,.07)}
tbody tr.sel td{background:rgba(17,141,255,.14);box-shadow:inset 3px 0 0 var(--blue)}
.ellipsis{max-width:230px;overflow:hidden;text-overflow:ellipsis}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px;white-space:pre-wrap;animation:fadeIn .4s both}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,rgba(130,180,240,.16),rgba(130,180,240,.38),rgba(130,180,240,.16));
 background-size:200% 100%;animation:sk 1.15s linear infinite;margin:14px 0}

/* ── бейджи / фильтры ── */
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:10.5px;font-weight:800;transition:transform .2s}
.badge:hover{transform:scale(1.07)}
.new{background:rgba(17,141,255,.17);color:#1986ff}
.work{background:rgba(112,71,255,.17);color:#8163ff}
.done{background:rgba(22,201,154,.18);color:#0caa80}
.fail{background:rgba(255,85,112,.17);color:#ef425e}
.wait{background:rgba(242,183,47,.19);color:#bd8500}
.critical{background:rgba(255,85,112,.17);color:#ef425e}
.high{background:rgba(255,120,80,.18);color:#e2622f}
.medium{background:rgba(242,183,47,.19);color:#bd8500}
.low{background:rgba(22,201,154,.15);color:#08956f}
.off{background:rgba(120,140,170,.2);color:#6c7f99}
.sla{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:10.5px;font-weight:900;color:#ef334f;
 padding:3px 7px;border-radius:999px;background:rgba(255,85,112,.14);animation:glowPulse 2.2s ease-in-out infinite}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line);background:var(--input);border-radius:11px;padding:8px 11px;font-size:12.5px;outline:none}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;color:var(--muted);transition:.25s}
.chip:hover{transform:translateY(-2px);color:var(--blue)}
.chip.on{background:linear-gradient(100deg,#087cff,#16c6ff);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(17,141,255,.3)}
.action{border:1px solid var(--line);background:transparent;border-radius:9px;padding:5px 10px;font-size:11px;transition:.2s}
.action:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}
.action.danger:hover{border-color:var(--red);color:var(--red)}

/* ── drawer ── */
.drawer{border-left:1px solid var(--line);background:var(--sidebar);backdrop-filter:blur(30px);
 padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
.drawer>*{animation:slideL .45s both}
.drawer h3{margin:2px 0 4px;font-size:19px}
.drawer .muted{font-size:12px;color:var(--muted)}
.detail-title{font-weight:800;font-size:11.5px;margin:16px 0 8px;color:var(--blue);text-transform:uppercase;letter-spacing:.6px}
.row{display:grid;grid-template-columns:112px 1fr;gap:8px;padding:5px 0;font-size:12px;align-items:start;border-bottom:1px dashed var(--line)}
.row span:first-child{color:var(--muted)}
.row b{word-break:break-word;white-space:pre-wrap}
.drawer-actions{display:grid;gap:8px;margin-top:18px}
.drawer-actions button{border-radius:12px;padding:10px;border:1px solid var(--line);background:var(--panel);transition:.25s}
.drawer-actions button:hover{transform:translateY(-2px);border-color:var(--blue)}
.drawer-actions .primary{color:#fff;border:0}
.drawer-actions .danger{color:var(--red)}
.drawer-actions .danger:hover{border-color:var(--red)}

/* ── модалка ── */
.modal{position:fixed;inset:0;background:rgba(0,14,32,.5);backdrop-filter:blur(12px);display:grid;place-items:center;padding:18px;z-index:40;animation:fadeIn .25s both}
.modal-card{width:min(860px,100%);max-height:92vh;overflow:auto;border-radius:26px;padding:22px;animation:pop .4s cubic-bezier(.2,.9,.3,1.15) both}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-head h3{margin:0;font-size:20px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.secondary{border:1px solid var(--line);background:var(--panel);padding:12px 18px;border-radius:12px;transition:.25s}
.secondary:hover{transform:translateY(-2px);border-color:var(--blue)}
.danger-btn{border:1px solid rgba(255,85,112,.5);background:rgba(255,85,112,.1);color:var(--red);padding:12px 18px;border-radius:12px}
.kkt-item{border:1px dashed var(--line);border-radius:16px;padding:12px;margin-bottom:10px;animation:pop .3s both}
.kkt-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.linkbtn{background:none;border:0;color:var(--red);font-size:12px;font-weight:700}

/* ── прочее ── */
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:10px;z-index:70}
.toast{padding:13px 16px;border-radius:14px;font-size:12.5px;max-width:350px;color:#fff;
 box-shadow:var(--shadow);animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2);white-space:pre-wrap;transition:opacity .3s,transform .3s}
.toast.err{background:linear-gradient(100deg,#ff4f6d,#ff7d5c)}
.toast.ok{background:linear-gradient(100deg,#11b07f,#2ad0a5)}
.toast.info{background:linear-gradient(100deg,#0f7bff,#16c6ff)}
.flag{position:fixed;left:14px;bottom:14px;z-index:70;font-size:11px;font-weight:800;padding:7px 13px;
 border-radius:999px;background:linear-gradient(100deg,#f2b72f,#ffd76a);color:#3a2a00;box-shadow:var(--shadow);animation:fadeUp .5s both}
.theme-btn{position:fixed;right:20px;top:18px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);z-index:10}

@media(max-width:1280px){#app{grid-template-columns:220px 1fr}.drawer{display:none}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){
 #app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}
 .nav{grid-template-columns:repeat(2,1fr)}.main{padding:14px}
 .chartgrid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}
 .search{display:none}.formgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<button class="theme-btn" id="themeBtn" type="button">🌙</button>

<section id="login">
  <div class="login-card glass">
    <span class="logo" data-logo role="img" aria-label="LIFE PAY"></span>
    <h1>Вход в CRM</h1>
    <p>Заявки, организации, исполнители и пользователи — в одном окне.</p>
    <form id="loginForm">
      <div class="field"><label for="lgName">Логин</label><input id="lgName" autocomplete="username" value="admin"></div>
      <div class="field"><label for="lgPass">Пароль</label><input id="lgPass" type="password" autocomplete="current-password" value="admin"></div>
      <button class="primary block" id="lgBtn" type="submit">Войти</button>
      <div class="error" id="lgErr" role="alert"></div>
    </form>
    <div class="hintbox" id="lgHint"></div>
  </div>
</section>

<section id="app" class="hidden">
  <aside class="sidebar">
    <div class="side-logo"><span class="logo" data-logo role="img" aria-label="LIFE PAY"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="userbox">
      <div class="avatar" id="avatar">?</div>
      <div><b id="who">—</b><div class="small" id="whoRole"></div></div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <div><h2 id="pageTitle">CRM</h2><div class="sub" id="pageSub"></div></div>
      <input id="search" class="search" placeholder="Поиск: организация, No, телефон, ИНН…">
      <button class="iconbtn" id="themeBtn2" type="button" title="Тема">🌙</button>
      <button class="iconbtn" id="reloadBtn" type="button" title="Обновить">⟳</button>
      <button class="iconbtn" id="logoutBtn" type="button" title="Выйти">⎋</button>
    </div>
    <div id="content"></div>
  </main>
  <aside class="drawer" id="drawer"></aside>
</section>

<div id="modal" class="modal hidden"></div>
<div id="toasts"></div>

<script>
'use strict';
/*═══════════ КОНФИГ ═══════════*/
const CFG = {
  API: '',            // ← https://script.google.com/macros/s/XXXX/exec
  DEMO: true,         // ← true: всё работает без сервера
  TIMEOUT: 25000,
  SLA_HOURS: 60
};
if (!CFG.API) CFG.DEMO = true;

/*═══════════ ЛОГОТИП ═══════════*/
const LOGO_SVG=`<svg viewBox="0 0 142.001 23.585" fill="none" xmlns="http://www.w3.org/2000/svg">

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function fmt(v){if(!v)return '—';const d=new Date(v);if(isNaN(d))return esc(v);
  return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});}
function hoursSince(ts){return (Date.now()-new Date(ts).getTime())/36e5;}
function isOverdue(r){return !['Выполнено','Отменено'].includes(r.status) && hoursSince(r.ts)>CFG.SLA_HOURS;}
function countUp(el,to){let s=null,from=0,dur=700;
  function step(t){if(!s)s=t;const p=Math.min(1,(t-s)/dur);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

/* ripple */
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.primary,.chip,.action,.iconbtn');if(!b)return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement('span');
  d.className='rip';d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
  if(getComputedStyle(b).position==='static')b.style.position='relative';
  b.appendChild(d);setTimeout(()=>d.remove(),620);
});

/*═══════════ API ═══════════*/
const apiOk=()=>/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(CFG.API);
async function call(action,payload){
  if(CFG.DEMO) return DEMO.call(action,payload||{});
  if(!apiOk()) throw new Error(
    'CFG.API не настроен.\nСейчас: "'+CFG.API+'"\n\nНужен адрес вида\nhttps://script.google.com/macros/s/.../exec\n'+
    'Относительный путь на статике всегда даёт 405 Not Allowed.');
  const c=new AbortController(),t=setTimeout(()=>c.abort(),CFG.TIMEOUT);
  let res,raw;
  try{
    res=await fetch(CFG.API,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,payload:payload||{},token:S.token}),signal:c.signal});
    raw=(await res.text()).trim();
  }catch(e){clearTimeout(t);
    throw new Error(e.name==='AbortError'?'Сервер не ответил за '+(CFG.TIMEOUT/1000)+' с':'Нет связи: '+(e.message||e));}
  clearTimeout(t);
  if(raw.startsWith('<')){
    if(res.status===405) throw new Error('HTTP 405 — это страница nginx, а не Apps Script.\nPOST ушёл на хостинг сайта. Пропишите /exec в CFG.API.');
    if(/accounts\.google\.com|Sign in|Войдите/i.test(raw)) throw new Error('Apps Script требует вход Google.\nРазвернуть → Доступ = «Все».');
    if(/Script function not found/i.test(raw)) throw new Error('В Apps Script нет doPost(e). Добавьте и переразверните.');
    throw new Error('Сервер вернул HTML ('+res.status+'):\n'+raw.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,180));
  }
  let d;try{d=raw?JSON.parse(raw):{};}catch{throw new Error('Ответ не JSON:\n'+raw.slice(0,200));}
  if(res.status===401||d.code===401){forceLogout();throw new Error(d.error||'Сессия истекла');}
  if(d.ok===false) throw new Error(d.error||'Ошибка сервера');
  return d.result!==undefined?d.result:d;
}

    if(p.id){const e=db.execs.find(x=>x.id===p.id);
      Object.assign(e,{name:p.name,phone:p.phone,email:p.email,active:!!p.active});
      log('update','executor',e.id,e.name);return e;}
    const e={id:uid(),name:p.name,phone:p.phone,email:p.email,active:true};
    db.execs.push(e);log('create','executor',e.id,e.name);return e;}
  case 'toggleExec':{need('ADMIN');const e=db.execs.find(x=>x.id===p.id);e.active=!e.active;
    log('toggle','executor',e.id,e.name+' → '+(e.active?'вкл':'выкл'));return e;}
  case 'deleteExec':{need('ADMIN');
    if(db.reqs.some(r=>r.executorId===p.id))throw new Error('Нельзя удалить: есть назначенные заявки.');
    const i=db.execs.findIndex(x=>x.id===p.id);log('delete','executor',p.id,db.execs[i].name);
    db.execs.splice(i,1);return {ok:true};}
  case 'saveSettings':{need('ADMIN');Object.assign(db.settings,p);CFG.SLA_HOURS=Number(p.slaHours)||60;
    log('update','settings','','SLA='+db.settings.slaHours+' ч');return db.settings;}
  case 'testMail':{need('ADMIN');log('test','mail','',p.to);return {ok:true,message:'Демо: письмо «отправлено» на '+p.to};}
  case 'ping':return {ok:true,mode:'demo'};
  default:throw new Error('Неизвестное действие: '+action);}
}
return {call:api};
})();

async function refresh(){
  const d=await call('bootstrap',{});
  S.me=d.me||S.me;S.requests=d.requests||[];S.stats=d.stats||{};S.chart=d.chart||[];
  S.orgs=d.orgs||[];S.execs=d.execs||[];S.users=d.users||[];S.log=d.log||[];S.settings=d.settings||{};

  $('whoRole').textContent=(m.role||'')+(m.organization?' · '+m.organization:'');

async function go(page){
  if(S.busy)return;
  if(PAGES[page]&&!PAGES[page].all&&!isAdmin()){toast('Раздел доступен только ADMIN');return;}
  S.page=page;buildNav();
  const meta=PAGES[page]||PAGES.dashboard;
  $('pageTitle').textContent=meta.t;$('pageSub').textContent=meta.s;
  $('content').innerHTML=skeleton();S.busy=true;
  try{
    await refresh();
    ({dashboard:renderDash,requests:renderRequests,orgs:renderOrgs,
      execs:renderExecs,users:renderUsers,log:renderLog,settings:renderSettings}[page]||renderDash)();
  }catch(e){
    $('content').innerHTML=`<div class="card glass empty">⚠️ ${esc(e.message)}</div>`;toast(e.message);

}

    p.notifyOrg=!!p.notifyOrg;p.notifyExec=!!p.notifyExec;p.slaHours=Number(p.slaHours)||60;
    try{await call('saveSettings',p);toast('Настройки сохранены','ok');go('settings');}
    catch(e){$('setErr').textContent=e.message;}

}

/*═══════════ DRAWER ═══════════*/
function renderDrawer(x){
  if(!x){$('drawer').innerHTML='<h3>Заявка</h3><div class="muted">Выберите заявку из списка.</div>';return;}
  $('drawer').dataset.key=x.id;
  const L=(a,b)=>`<div class="row"><span>${a}</span><b>${b}</b></div>`;
  $('drawer').innerHTML=`
   <h3>Заявка No${esc(x.no)}</h3>
   <div class="muted">${esc(x.organization)} · ${fmt(x.ts)}</div>
   ${x.overdue?`<div class="sla" style="margin-top:10px">🔴 ПРОСРОЧКА · ${Math.floor(hoursSince(x.ts))} ч из ${CFG.SLA_HOURS}</div>`:
     `<div class="mini" style="margin-top:8px">В работе ${Math.floor(hoursSince(x.ts))} ч из ${CFG.SLA_HOURS}</div>`}
   <div class="detail-title">Основное</div>
   ${L('Приоритет',badge(x.priority))}${L('Статус',badge(x.status))}
   ${L('Передал',esc(x.employee||'—'))}${L('Исполнитель',esc(x.executor||'—'))}
   ${L('Комментарий',esc(x.comment||'—'))}
   <div class="detail-title">Организация</div>
   ${L('Наименование',esc(x.organization))}${L('ИНН',esc(x.inn||'—'))}
   ${L('Контакт',esc(x.contact||'—'))}${L('Телефон',esc(x.phone||'—'))}${L('E-mail',esc(x.email||'—'))}
   <div class="detail-title">ККТ</div>
   ${L('Количество',esc(x.kktCount||'—'))}${L('РНМ',esc(x.rnm||'—'))}${L('ЗН ККТ',esc(x.zn||'—'))}
   ${L('ФН',esc(x.fn||'—'))}${L('Модель',esc(x.model||'—'))}
   <div class="detail-title">Сопровождение</div>
   ${L('Выезд',esc(x.needTrip||'Нет'))}${L('Адрес выезда',esc(x.tripAddress||'—'))}
   ${L('ЕСП',esc(x.esp||'Нет'))}${L('КЭП',esc(x.kep||'Нет'))}${L('Wi-Fi',esc(x.wifi||'Нет'))}
   <div class="drawer-actions">
     <button class="primary" type="button" data-d="edit">✎ Редактировать заявку</button>
     <button type="button" data-d="status">◉ Сменить статус</button>
     ${isAdmin()?'<button type="button" data-d="transfer">⇄ Передать заявку</button>':''}
     ${isAdmin()?'<button class="danger" type="button" data-d="del">🗑 Удалить</button>':''}
   </div>`;
}
$('drawer').addEventListener('click',async e=>{
  const b=e.target.closest('[data-d]');if(!b)return;
  const item=S.requests.find(r=>r.id===$('drawer').dataset.key);if(!item)return;
  if(b.dataset.d==='edit')openRequest(item);
  if(b.dataset.d==='status')openStatus(item);
  if(b.dataset.d==='transfer')openTransfer(item);
  if(b.dataset.d==='del'&&confirm('Удалить заявку No'+item.no+'?')){
    try{await call('deleteRequest',{id:item.id});toast('Заявка удалена','ok');go(S.page);}catch(er){toast(er.message);}}
});

/*═══════════ ДЕЛЕГИРОВАНИЕ В КОНТЕНТЕ ═══════════*/
$('content').addEventListener('change',e=>{
  const f=e.target.closest('[data-f]');if(!f)return;
  S.filters[f.dataset.f]=f.value;renderRequests();
});
$('content').addEventListener('click',async e=>{
  const t=e.target;
  const nav=t.closest('[data-nav]');if(nav){go(nav.dataset.nav);return;}
  const act=t.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='new')return openRequest(null);
    if(a==='overdue'){S.filters.overdue=!S.filters.overdue;return renderRequests();}
    if(a==='clear'){S.filters={status:'',priority:'',exec:'',overdue:false,q:''};$('search').value='';return renderRequests();}
    if(a==='csv')return exportCSV();
    if(a==='org-new')return openOrg(null);
    if(a==='ex-new')return openExec(null);
    if(a==='user-new')return openUser(null);
    if(a==='ping'){try{const r=await call('ping',{});toast('Соединение в порядке: '+JSON.stringify(r),'ok');}catch(er){toast(er.message);}return;}
    if(a==='mail'){const to=prompt('E-mail для теста:',S.settings.mailFrom||'');if(!to)return;
      try{const r=await call('testMail',{to});toast(r.message||'Отправлено','ok');}catch(er){toast(er.message);}return;}
  }
  const map=[['org-edit',id=>openOrg(S.orgs.find(o=>o.id===id))],
             ['org-req',id=>{S.filters.q=(S.orgs.find(o=>o.id===id)||{}).name||'';$('search').value=S.filters.q;go('requests');}],
             ['org-tog',async id=>{await call('toggleOrg',{id});toast('Обновлено','ok');go('orgs');}],
             ['org-del',async id=>{if(confirm('Удалить организацию?')){await call('deleteOrg',{id});toast('Удалено','ok');go('orgs');}}],
             ['ex-edit',id=>openExec(S.execs.find(x=>x.id===id))],
             ['ex-tog',async id=>{await call('toggleExec',{id});go('execs');}],
             ['ex-del',async id=>{if(confirm('Удалить исполнителя?')){await call('deleteExec',{id});toast('Удалено','ok');go('execs');}}],
             ['us-edit',id=>openUser(S.users.find(u=>u.id===id))],
             ['us-tog',async id=>{await call('toggleUser',{id});go('users');}],
             ['us-del',async id=>{if(confirm('Удалить пользователя?')){await call('deleteUser',{id});toast('Удалено','ok');go('users');}}]];
  for(const [attr,fn] of map){
    const el=t.closest('[data-'+attr+']');
    if(el){try{await fn(el.dataset[attr.replace(/-(\w)/g,(m,c)=>c.toUpperCase())]);}catch(er){toast(er.message);}return;}
  }
  const ob=t.closest('[data-open]'),tr=t.closest('tr[data-key]');
  const key=ob?ob.dataset.open:(tr?tr.dataset.key:null);
  if(!key)return;
  const item=S.requests.find(r=>r.id===key);if(!item)return;
  S.selected=key;
  document.querySelectorAll('tr[data-key]').forEach(el=>el.classList.toggle('sel',el.dataset.key===key));
  renderDrawer(item);
  if(ob&&window.innerWidth<=1280)openRequest(item);
});

/*═══════════ МОДАЛКИ ═══════════*/
function modal(html){$('modal').classList.remove('hidden');$('modal').innerHTML=html;}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML='';}
$('modal').addEventListener('click',e=>{
  if(e.target===$('modal'))return closeModal();
  const b=e.target.closest('[data-m]');if(!b)return;
  if(b.dataset.m==='close')closeModal();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').classList.contains('hidden'))closeModal();});
const opt=(arr,cur)=>arr.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('');
const optId=(arr,cur)=>`<option value="">— не выбрано —</option>`+
  arr.map(v=>`<option value="${esc(v.id)}" ${v.id===cur?'selected':''}>${esc(v.name)}</option>`).join('');

/* заявка: создание и полное редактирование */

     <div class="field"><label>E-mail организации</label><input name="email" type="email" value="${esc(e.email||'')}"></div>
     <div class="field"><label>Сотрудник LIFE PAY (передал)</label><input name="employee" value="${esc(e.employee||(S.me&&S.me.name)||'')}"></div>
     <div class="field"><label>Приоритет</label><select name="priority">${opt(['Низкий','Средний','Высокий','Критический'],e.priority||'Средний')}</select></div>
     <div class="field"><label>Статус</label><select name="status" ${x?'':'disabled'}>${opt(['Новая','В работе','Ожидание','Выполнено','Отменено'],e.status||'Новая')}</select></div>

     <div class="field"><label>Модель ККТ</label><input name="model" value="${esc(e.model||'')}"></div>
     <div class="field"><label>РНМ</label><input name="rnm" value="${esc(e.rnm||'')}"></div>
     <div class="field"><label>ЗН ККТ</label><input name="zn" value="${esc(e.zn||'')}"></div>
     <div class="field"><label>ФН</label><input name="fn" value="${esc(e.fn||'')}"></div>
     <div class="field"><label>Нужен выезд</label><select name="needTrip">${opt(['Нет','Да'],e.needTrip||'Нет')}</select></div>
     <div class="field"><label>Адрес выезда</label><input name="tripAddress" value="${esc(e.tripAddress||'')}"></div>
     <div class="field"><label>Зарегистрирован в ЕСП</label><select name="esp">${opt(['Нет','Да'],e.esp||'Нет')}</select></div>
     <div class="field"><label>Есть КЭП</label><select name="kep">${opt(['Нет','Да'],e.kep||'Нет')}</select></div>
     <div class="field"><label>Есть Wi-Fi</label><select name="wifi">${opt(['Нет','Да'],e.wifi||'Нет')}</select></div>
     <div class="field full"><label>Комментарий</label><textarea name="comment">${esc(e.comment||'')}</textarea></div>
   </div>
   <div class="error" id="rErr"></div>
   <div class="modal-actions">
     <button class="secondary" type="button" data-m="close">Отмена</button>
     <button class="primary" type="submit" id="rSub">${x?'Сохранить изменения':'Создать заявку'}</button>
   </div></form></div>`);
  $('rForm').addEventListener('submit',async ev=>{

/*═══════════ ЭКСПОРТ ═══════════*/
function exportCSV(){
  const rows=filtered();
  const cols=['no','ts','employee','priority','status','executor','organization','inn','contact','phone','email',
    'kktCount','rnm','zn','fn','model','needTrip','tripAddress','esp','kep','wifi','comment'];
  const csv=['\ufeff'+cols.join(';')].concat(rows.map(r=>cols.map(c=>{
    let v=c==='ts'?fmt(r.ts):r[c];return '"'+String(v??'').replace(/"/g,'""')+'"';}).join(';'))).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='requests_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  toast('Экспортировано строк: '+rows.length,'ok');
}
