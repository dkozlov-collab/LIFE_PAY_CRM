<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFE PAY — CRM</title>
<style>
:root{
 --bg:#eceef1;--bg2:#f6f7f9;--panel:rgba(255,255,255,.86);--panel2:rgba(255,255,255,.6);
 --text:#0d1219;--muted:#6b7583;--line:rgba(13,18,25,.11);--line2:rgba(13,18,25,.055);
 --acc:#111a26;--acc-t:#f7f8fa;--gold:#a9853f;--gold-s:rgba(169,133,63,.14);
 --ok:#2d7a5c;--warn:#a5742a;--bad:#9d2b36;
 --field:rgba(255,255,255,.9);--head:rgba(13,18,25,.035);
 --sh:0 1px 2px rgba(16,24,40,.04),0 14px 34px rgba(16,24,40,.07);
 --sh2:0 2px 6px rgba(16,24,40,.06),0 26px 60px rgba(16,24,40,.12);
 --r:14px;
}
html[data-theme=dark]{
 --bg:#090c11;--bg2:#0e131a;--panel:rgba(20,26,34,.84);--panel2:rgba(16,21,28,.6);
 --text:#e7ecf3;--muted:#8a96a6;--line:rgba(231,236,243,.13);--line2:rgba(231,236,243,.07);
 --acc:#e7ecf3;--acc-t:#0b0f14;--gold:#cbab64;--gold-s:rgba(203,171,100,.16);
 --ok:#4cb98b;--warn:#dcae57;--bad:#df6f79;
 --field:rgba(9,13,18,.55);--head:rgba(231,236,243,.045);
 --sh:0 1px 2px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.45);
 --sh2:0 2px 8px rgba(0,0,0,.5),0 30px 70px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden;
 font-family:'Inter','Segoe UI',system-ui,Arial,sans-serif;font-feature-settings:"tnum" 1,"cv05" 1;
 -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:
 radial-gradient(1100px 620px at 12% -8%,var(--gold-s),transparent 62%),
 radial-gradient(900px 560px at 92% 4%,rgba(120,150,190,.12),transparent 60%),
 linear-gradient(180deg,var(--bg2),var(--bg));}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
 background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);
 background-size:64px 64px;mask-image:radial-gradient(120% 90% at 50% 0%,#000 30%,transparent 78%)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* анимации — сдержанные */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes popq{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes grow{from{height:0!important;opacity:0}}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes hair{0%{transform:scaleX(0);opacity:0}40%{opacity:1}100%{transform:scaleX(1);opacity:1}}
@keyframes pulseSoft{0%,100%{opacity:1}50%{opacity:.45}}
.anim{animation:up .5s cubic-bezier(.22,.7,.28,1) both}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
 backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:var(--sh)}
.card{padding:18px 20px;transition:box-shadow .35s,transform .35s,border-color .35s}
.card:hover{box-shadow:var(--sh2);border-color:var(--line)}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.rule{height:1px;background:var(--line);margin:14px 0;transform-origin:left;animation:hair .7s ease both}

/* логотип */
.logo{display:block;width:132px;color:#0d141d}
.logo svg{width:100%;height:auto;display:block}
html[data-theme=dark] .logo{color:#f2f5f9}

/* ── тумблер темы ── */
.tsw{position:relative;width:60px;height:30px;border-radius:999px;border:1px solid var(--line);
 background:var(--panel2);flex:none;transition:background .35s,border-color .35s;overflow:hidden}
.tsw:hover{border-color:var(--gold)}
.tsw i{position:absolute;top:0;bottom:0;width:30px;display:grid;place-items:center;color:var(--muted);transition:color .35s,opacity .35s}
.tsw i svg{width:15px;height:15px;display:block}
.tsw .s{left:0}.tsw .m{right:0}
html[data-theme=light] .tsw .s{color:var(--gold)}
html[data-theme=dark] .tsw .m{color:var(--gold)}
.tsw b{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
 background:var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.28);
 transition:transform .42s cubic-bezier(.5,.05,.2,1.2)}
html[data-theme=dark] .tsw b{transform:translateX(30px)}
.tsw.fixed{position:fixed;right:22px;top:22px;z-index:20}

/* ── логин ── */
#login{min-height:100vh;display:grid;place-items:center;padding:26px}
.login-card{width:min(430px,100%);padding:34px 32px;animation:popq .55s cubic-bezier(.22,.7,.28,1) both}
.login-card h1{font-size:27px;margin:20px 0 6px;font-weight:650;letter-spacing:-.03em}
.login-card p{color:var(--muted);margin:0 0 20px;font-size:13.5px;line-height:1.55}
.field{display:grid;gap:6px;margin:13px 0}
.field label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--line);
 background:var(--field);outline:none;font-size:13.5px;transition:border-color .25s,box-shadow .25s}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-s)}
.field input:disabled{opacity:.6}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:11px 16px;
 font-size:13px;font-weight:600;transition:.28s}
.btn:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
.btn.solid{background:var(--acc);color:var(--acc-t);border-color:transparent}
.btn.solid:hover{color:var(--acc-t);opacity:.9;box-shadow:var(--sh2)}
.btn.block{width:100%;padding:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn.bad:hover{border-color:var(--bad);color:var(--bad)}
.err{min-height:18px;color:var(--bad);font-size:12px;margin-top:10px;white-space:pre-wrap}
.note{margin-top:16px;padding:12px 13px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);
 font-size:11.5px;color:var(--muted);line-height:1.6}
.note b{color:var(--text)}

/* ── каркас ── */
#app{display:grid;grid-template-columns:230px 1fr 350px;min-height:100vh}
.side{padding:22px 14px;border-right:1px solid var(--line);background:var(--panel2);
 backdrop-filter:blur(24px);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side-logo{padding:4px 8px 20px}
.nav{display:grid;gap:2px}
.nav button{position:relative;width:100%;padding:10px 12px;border-radius:10px;text-align:left;font-size:13px;
 font-weight:550;color:var(--muted);display:flex;align-items:center;gap:10px;transition:.25s}
.nav button svg{width:15px;height:15px;flex:none;opacity:.75}
.nav button:hover{color:var(--text);background:var(--head)}
.nav button.active{color:var(--text);background:var(--head);font-weight:650}
.nav button.active:before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:2px;background:var(--gold);border-radius:2px}
.nav button.active svg{opacity:1;color:var(--gold)}
.me{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.ava{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;
 background:var(--acc);color:var(--acc-t);font-weight:700;font-size:14px}
.me b{font-size:12.5px;display:block}
.me span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.main{padding:22px 26px;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;animation:up .45s both}
.top h2{margin:2px 0 0;font-size:23px;font-weight:650;letter-spacing:-.035em}
.top .sub{font-size:12px;color:var(--muted);margin-top:3px}
.search{margin-left:auto;width:min(300px,30vw);border:1px solid var(--line);background:var(--field);
 border-radius:11px;padding:10px 13px;font-size:13px;outline:none;transition:.28s}
.search:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-s)}
.ico{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);
 display:grid;place-items:center;flex:none;transition:.28s}
.ico svg{width:16px;height:16px}
.ico:hover{border-color:var(--gold);color:var(--gold)}
.ico.rot svg{animation:rot .7s cubic-bezier(.5,0,.3,1)}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{padding:16px 17px}
.kpi b{display:block;font-size:29px;font-weight:600;letter-spacing:-.045em;margin:8px 0 3px}
.kpi .d{font-size:11px;color:var(--muted)}
.kpi.acc b{color:var(--gold)}
.kpi.bad b{color:var(--bad)}
.kpi.warn b{color:var(--warn)}

/* ── графики ── */
.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:12px;margin-top:12px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.head b{font-size:14px;font-weight:650}
.mini{font-size:11px;color:var(--muted)}
.chart{height:168px;display:flex;align-items:flex-end;gap:8px;padding-top:14px}
.bar{flex:1;max-width:46px;border-radius:3px;background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 55%,transparent));
 animation:grow .8s cubic-bezier(.22,.7,.28,1) both;transition:opacity .25s;opacity:.85}
.bar:hover{opacity:1}
.chart-x{display:flex;gap:8px;margin-top:8px}
.chart-x span{flex:1;max-width:46px;text-align:center;font-size:9.5px;color:var(--muted)}
.stat-list{display:grid;gap:11px;margin-top:14px}
.stat{display:grid;grid-template-columns:96px 1fr 38px;align-items:center;gap:10px;font-size:12px}
.track{height:5px;border-radius:5px;background:var(--head);overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:var(--acc);transition:width .8s cubic-bezier(.22,.7,.28,1)}
.track i.ok{background:var(--ok)}.track i.warn{background:var(--warn)}.track i.bad{background:var(--bad)}
.stat b{text-align:right;font-weight:600}

/* ── таблица ── */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:60vh;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px 11px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line2)}
th{position:sticky;top:0;z-index:1;background:var(--head);backdrop-filter:blur(8px);
 font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
tbody tr{cursor:pointer;animation:fade .35s both;transition:background .2s}
tbody tr:hover td{background:var(--head)}
tbody tr.sel td{background:var(--gold-s);box-shadow:inset 2px 0 0 var(--gold)}
.ell{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.empty{padding:44px;text-align:center;color:var(--muted);font-size:12.5px;white-space:pre-wrap;animation:fade .4s both}
.skel{height:12px;border-radius:6px;margin:15px 0;background:linear-gradient(90deg,var(--head),var(--line),var(--head));
 background-size:200% 100%;animation:sk 1.2s linear infinite}

/* ── бейджи ── */
.bg{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:650;letter-spacing:.04em;
 padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.bg:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.bg.n{color:var(--text)}.bg.w{color:var(--gold)}.bg.h{color:var(--warn)}
.bg.d{color:var(--ok)}.bg.x{color:var(--bad)}.bg.o{opacity:.7}

/* ── таймер SLA ── */
.tv{font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ok)}
.tv.warn{color:var(--warn)}
.tv.bad{color:var(--bad);animation:pulseSoft 2s ease-in-out infinite}
.tv.done{color:var(--muted);font-weight:500}
.tcell{min-width:132px}
.tcell .track{margin-top:5px;width:120px}
.sla-box{margin-top:14px;padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.sla-box .big{font-size:27px;font-weight:600;letter-spacing:-.04em;margin:7px 0 10px;font-variant-numeric:tabular-nums}
.sla-box .big.warn{color:var(--warn)}.sla-box .big.bad{color:var(--bad)}.sla-box .big.ok{color:var(--ok)}
.sla-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:8px}

/* ── фильтры ── */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.filters select,.filters input{border:1px solid var(--line);background:var(--field);border-radius:9px;
 padding:7px 10px;font-size:12px;outline:none}
.chip{border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:11.5px;font-weight:600;
 color:var(--muted);background:var(--panel2);transition:.25s}
.chip:hover{color:var(--text);border-color:var(--gold)}
.chip.on{background:var(--acc);color:var(--acc-t);border-color:transparent}
.act{border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:10.5px;font-weight:600;
 color:var(--muted);transition:.22s}
.act:hover{color:var(--gold);border-color:var(--gold)}
.act.bad:hover{color:var(--bad);border-color:var(--bad)}

/* ── drawer ── */
.drawer{border-left:1px solid var(--line);background:var(--panel2);backdrop-filter:blur(24px);
 padding:20px;position:sticky;top:0;height:100vh;overflow:auto}
.drawer>*{animation:slideL .4s both}
.drawer h3{margin:4px 0 3px;font-size:18px;font-weight:650;letter-spacing:-.03em}
.drawer .muted{font-size:11.5px;color:var(--muted)}
.sect{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
 margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px 1fr;gap:8px;padding:5px 0;font-size:12px;align-items:start}
.row span{color:var(--muted)}
.row b{font-weight:600;word-break:break-word;white-space:pre-wrap}
.dacts{display:grid;gap:7px;margin-top:18px}

/* ── модалка ── */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;
 background:rgba(8,11,15,.5);backdrop-filter:blur(8px);animation:fade .22s both}
.mcard{width:min(840px,100%);max-height:92vh;overflow:auto;padding:24px;animation:popq .32s cubic-bezier(.22,.7,.28,1) both}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mhead h3{margin:0;font-size:18px;font-weight:650;letter-spacing:-.03em}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.full{grid-column:1/-1}
.macts{display:flex;justify-content:flex-end;gap:9px;margin-top:18px;flex-wrap:wrap}

/* ── тосты ── */
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:9px;z-index:70;max-width:340px}
.toast{padding:12px 14px;border-radius:11px;font-size:12px;line-height:1.5;white-space:pre-wrap;
 border:1px solid var(--line);background:var(--panel);box-shadow:var(--sh2);backdrop-filter:blur(18px);
 animation:up .3s cubic-bezier(.22,.7,.28,1);transition:opacity .3s,transform .3s;border-left:2px solid var(--muted)}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--bad)}
.toast.info{border-left-color:var(--gold)}
.flag{position:fixed;left:16px;bottom:16px;z-index:60;font-size:9.5px;font-weight:700;letter-spacing:.14em;
 text-transform:uppercase;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
 background:var(--panel);color:var(--muted);box-shadow:var(--sh)}

@media(max-width:1300px){#app{grid-template-columns:210px 1fr}.drawer{display:none}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:880px){
 #app{grid-template-columns:1fr}.side{position:relative;height:auto}
 .nav{grid-template-columns:repeat(2,1fr);display:grid}
 .main{padding:14px}.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}
 .search{display:none}.fgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section id="login">
  <div class="panel login-card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <span class="logo" data-logo role="img" aria-label="LIFE PAY"></span>
      <button class="tsw" data-theme-btn aria-label="Сменить тему"><b></b>
        <i class="s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></i>
        <i class="m"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></i>
      </button>
    </div>
    <h1>Вход в систему</h1>
    <p>Управление заявками, организациями и исполнителями. Контроль SLA в реальном времени.</p>
    <form id="loginForm">
      <div class="field"><label for="lgName">Логин</label><input id="lgName" autocomplete="username" value="admin"></div>
      <div class="field"><label for="lgPass">Пароль</label><input id="lgPass" type="password" autocomplete="current-password" value="admin"></div>
      <button class="btn solid block" id="lgBtn" type="submit">Войти</button>
      <div class="err" id="lgErr" role="alert"></div>
    </form>
    <div class="note" id="lgHint"></div>
  </div>
</section>

<section id="app" class="hidden">
  <aside class="side">
    <div class="side-logo"><span class="logo" data-logo role="img" aria-label="LIFE PAY"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="me">
      <div class="ava" id="ava">—</div>
      <div><b id="who">—</b><span id="whoRole"></span></div>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div><div class="eyebrow" id="pageKicker">CRM</div><h2 id="pageTitle">—</h2><div class="sub" id="pageSub"></div></div>
      <input id="search" class="search" placeholder="Поиск по № / организации / ИНН / телефону">
      <button class="tsw" data-theme-btn aria-label="Сменить тему"><b></b>
        <i class="s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></i>
        <i class="m"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></i>
      </button>
      <button class="ico" id="reloadBtn" title="Обновить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></button>
      <button class="ico" id="logoutBtn" title="Выйти"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
    <div id="content"></div>
  </main>

  <aside class="drawer" id="drawer"></aside>
</section>

<div id="modal" class="modal hidden"></div>
<div id="toasts"></div>

<script>
'use strict';
/*═════ КОНФИГ ═════*/
const CFG={

  TIMEOUT:25000,

function fmt(v){if(!v)return '—';const d=new Date(v);if(isNaN(d))return esc(v);
  return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});}
function pad(n){return String(n).padStart(2,'0');}
function dur(ms){ms=Math.max(0,ms);
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
  return d>0?(d+' д '+pad(h)+':'+pad(m)):(pad(h)+':'+pad(m)+':'+pad(s));}
function durShort(ms){const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h+' ч '+pad(m)+' м';}
const deadline=r=>new Date(r.ts).getTime()+CFG.SLA_HOURS*H;
const CLOSED=['Выполнено','Отменено'];
const isClosed=r=>CLOSED.includes(r.status);
function overdue(r){return !isClosed(r)&&Date.now()>deadline(r);}
function lvl(left){return left<0?'bad':(left<CFG.WARN_HOURS*H?'warn':'ok');}
function countUp(el,to){let s=null;const dr=650;
  requestAnimationFrame(function st(t){if(!s)s=t;const p=Math.min(1,(t-s)/dr);
    el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st);});}
function debounce(f,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms);};}

/*═════ ЖИВОЙ ТАЙМЕР SLA ═════*/
function timerCell(r){
  if(isClosed(r)){
    const done=r.doneAt||r.updatedAt||r.ts;
    const spent=new Date(done).getTime()-new Date(r.ts).getTime();
    const inTime=spent<=CFG.SLA_HOURS*H;
    return `<div class="tcell"><span class="tv done">${durShort(spent)} · ${inTime?'в срок':'с нарушением'}</span>
      <div class="track"><i class="${inTime?'ok':'bad'}" style="width:${Math.min(100,spent/(CFG.SLA_HOURS*H)*100)}%"></i></div></div>`;
  }
  const st=new Date(r.ts).getTime(),dl=deadline(r);
  return `<div class="tcell">
    <span class="tv" data-dl="${dl}" data-st="${st}">—</span>
    <div class="track"><i data-role="fill" data-dl="${dl}" data-st="${st}" style="width:0"></i></div></div>`;
}
function tick(){
  const now=Date.now();
  document.querySelectorAll('[data-dl]').forEach(el=>{
    const dl=+el.dataset.dl,st=+el.dataset.st,left=dl-now;
    const pct=Math.max(0,Math.min(100,(now-st)/(dl-st)*100));
    const k=lvl(left);
    if(el.dataset.role==='fill'){el.className=k;el.style.width=pct+'%';return;}
    const big=el.classList.contains('big');
    el.textContent=left>=0?dur(left):'−'+dur(-left);
    el.className=(big?'big ':'tv ')+k;
  });
}
setInterval(tick,1000);

async function call(action,payload){
  if(!LIVE) return CORE.call(action,payload||{});
  const c=new AbortController(),t=setTimeout(()=>c.abort(),CFG.TIMEOUT);
  let raw;
  try{
    const res=await fetch(CFG.API,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,payload:payload||{},token:S.token}),signal:c.signal});
    raw=(await res.text()).trim();
  }catch(e){clearTimeout(t);
    throw new Error(e.name==='AbortError'?'Сервер не ответил за '+(CFG.TIMEOUT/1000)+' с':'Нет связи с сервером');}
  clearTimeout(t);
  if(raw.startsWith('<')) throw new Error('Доступ к веб-приложению закрыт. Разверните Apps Script с параметром «Доступ: Все».');
  let d;try{d=raw?JSON.parse(raw):{};}catch{throw new Error('Некорректный ответ сервера');}
  if(d.code===401){forceLogout();throw new Error(d.error||'Сессия истекла');}
  if(d.ok===false) throw new Error(d.error||'Ошибка сервера');
  return d.result!==undefined?d.result:d;
}

    log('transfer','request',r.id,'№'+r.no+': '+f+' → '+(ex(r.executorId).name||'не назначен')+'; '+fo+' → '+org(r.orgId).name);
    return view(r);}
  case 'deleteRequest':{need('ADMIN');const i=db.reqs.findIndex(x=>x.id===p.id);if(i<0)throw new Error('Не найдено');
    log('delete','request',p.id,'№'+db.reqs[i].no);db.reqs.splice(i,1);return {ok:true};}
  case 'saveOrg':{need('ADMIN');
    if(p.id){const o=db.orgs.find(x=>x.id===p.id);if(!o)throw new Error('Не найдено');
      Object.assign(o,{name:p.name,inn:p.inn,contact:p.contact,phone:p.phone,email:p.email,active:!!p.active});
      log('update','org',o.id,o.name);return o;}
    const o={id:uid(),name:p.name,inn:p.inn,contact:p.contact,phone:p.phone,email:p.email,active:true,createdAt:Date.now()};
    db.orgs.push(o);log('create','org',o.id,o.name);return o;}
  case 'toggleOrg':{need('ADMIN');const o=db.orgs.find(x=>x.id===p.id);o.active=!o.active;
    log('toggle','org',o.id,o.name+' → '+(o.active?'активна':'отключена'));return o;}
  case 'deleteOrg':{need('ADMIN');
    if(db.reqs.some(r=>r.orgId===p.id))throw new Error('Есть связанные заявки — организацию можно только отключить');
    const i=db.orgs.findIndex(x=>x.id===p.id);log('delete','org',p.id,db.orgs[i].name);db.orgs.splice(i,1);return {ok:true};}
  case 'saveExec':{need('ADMIN');
    if(p.id){const e=db.execs.find(x=>x.id===p.id);Object.assign(e,{name:p.name,phone:p.phone,email:p.email,active:!!p.active});
      log('update','executor',e.id,e.name);return e;}
    const e={id:uid(),name:p.name,phone:p.phone,email:p.email,active:true};
    db.execs.push(e);log('create','executor',e.id,e.name);return e;}
  case 'toggleExec':{need('ADMIN');const e=db.execs.find(x=>x.id===p.id);e.active=!e.active;
    log('toggle','executor',e.id,e.name);return e;}
  case 'deleteExec':{need('ADMIN');
    if(db.reqs.some(r=>r.executorId===p.id))throw new Error('Есть назначенные заявки');
    const i=db.execs.findIndex(x=>x.id===p.id);log('delete','executor',p.id,db.execs[i].name);db.execs.splice(i,1);return {ok:true};}
  case 'saveUser':{need('ADMIN');
    if(p.id){const u=db.users.find(x=>x.id===p.id);
      Object.assign(u,{name:p.name,role:p.role,orgId:p.orgId||'',execId:p.execId||'',active:!!p.active});
      if(p.pass)u.pass=p.pass;log('update','user',u.id,u.login);return u;}
    if(db.users.some(x=>x.login===p.login))throw new Error('Такой логин уже существует');
    const u={id:uid(),login:p.login,pass:p.pass||'123',name:p.name,role:p.role||'ORG',
      orgId:p.orgId||'',execId:p.execId||'',active:true};
    db.users.push(u);log('create','user',u.id,u.login);return u;}
  case 'toggleUser':{need('ADMIN');const u=db.users.find(x=>x.id===p.id);
    if(u.login===cur.login)throw new Error('Нельзя отключить самого себя');
    u.active=!u.active;log('toggle','user',u.id,u.login);return u;}
  case 'deleteUser':{need('ADMIN');const u=db.users.find(x=>x.id===p.id);
    if(u.login===cur.login)throw new Error('Нельзя удалить самого себя');
    db.users.splice(db.users.indexOf(u),1);log('delete','user',p.id,u.login);return {ok:true};}
  case 'saveSettings':{need('ADMIN');Object.assign(db.settings,p);
    CFG.SLA_HOURS=Number(p.slaHours)||60;CFG.WARN_HOURS=Number(p.warnHours)||6;
    log('update','settings','','SLA '+db.settings.slaHours+' ч');return db.settings;}
  case 'testMail':{need('ADMIN');log('test','mail','',p.to);
    return {ok:true,message:'Локальный режим: письмо условно отправлено на '+p.to};}
  case 'ping':return {ok:true,mode:'local',version:db.settings.version};
  default:throw new Error('Неизвестное действие: '+action);}
}
return {call:api,randomIntake:()=>intake(SEED[Math.floor(Math.random()*SEED.length)])};

function renderLog(){
  const q=S.filters.q.toLowerCase();
  const rows=S.log.filter(l=>!q||[l.login,l.action,l.entity,l.details].join(' ').toLowerCase().includes(q));
  $('content').innerHTML=`<div class="panel card anim">
    <div class="head"><b>Журнал действий</b><span class="mini">${rows.length} записей</span></div>
    <div class="tw">${rows.length?`<table><thead><tr>
      <th>Время</th><th>Пользователь</th><th>Действие</th><th>Объект</th><th>Детали</th></tr></thead><tbody>
      ${rows.map((l,i)=>`<tr style="animation-delay:${Math.min(i*.02,.35)}s"><td class="num">${fmt(l.ts)}</td>
        <td><b>${esc(l.login)}</b></td><td><span class="bg">${esc(l.action)}</span></td>
        <td>${esc(l.entity||'—')}</td><td class="ell" title="${esc(l.details)}">${esc(l.details)}</td></tr>`).join('')}
      </tbody></table>`:'<div class="empty">Записей нет.</div>'}</div></div>`;
}

        <div class="field"><label>Уведомлять организацию</label>

      <div class="row"><span>Режим</span><b>${LIVE?'Рабочий (Apps Script)':'Автономный'}</b></div>
      <div class="row"><span>Адрес</span><b style="font-size:11px">${esc(CFG.API||'не задан')}</b></div>
      <div class="row"><span>SLA</span><b>${CFG.SLA_HOURS} ч</b></div>
      <div class="row"><span>Предупреждение</span><b>${CFG.WARN_HOURS} ч</b></div>
      <div class="row"><span>Версия</span><b>${esc(s.version||'—')}</b></div>

        <button class="btn" data-act="mail">Тестовое письмо</button></div>
      <div class="note">Приём заявок с сайта выполняется действием <b>intake</b> без авторизации. Сетевой запрос отправляется только на адрес вида <b>script.google.com/macros/s/.../exec</b>, поэтому обращения к статическому хостингу исключены.</div>

/*═════ DRAWER ═════*/
function renderDrawer(x){
  if(!x){$('drawer').innerHTML='<div class="eyebrow">Карточка</div><h3>Заявка не выбрана</h3><div class="muted">Выберите строку в таблице.</div>';return;}
  $('drawer').dataset.key=x.id;
  const L=(a,b)=>`<div class="row"><span>${a}</span><b>${b}</b></div>`;
  const st=new Date(x.ts).getTime(),dl=deadline(x);
  const slaBox=isClosed(x)
    ? (()=>{const d=new Date(x.doneAt||x.updatedAt||x.ts).getTime(),sp=d-st,ok=sp<=CFG.SLA_HOURS*H;
        return `<div class="sla-box"><div class="eyebrow">Заявка закрыта</div>
          <div class="big ${ok?'ok':'bad'}">${durShort(sp)}</div>
          <div class="track"><i class="${ok?'ok':'bad'}" style="width:${Math.min(100,sp/(CFG.SLA_HOURS*H)*100)}%"></i></div>
          <div class="sla-meta"><span>Принята ${fmt(x.ts)}</span><span>${ok?'В срок':'С нарушением SLA'}</span></div></div>`;})()
    : `<div class="sla-box"><div class="eyebrow">Остаток времени на выполнение</div>
        <div class="big" data-dl="${dl}" data-st="${st}">—</div>
        <div class="track"><i data-role="fill" data-dl="${dl}" data-st="${st}" style="width:0"></i></div>
        <div class="sla-meta"><span>Принята ${fmt(x.ts)}</span><span>Крайний срок ${fmt(dl)}</span></div></div>`;
  $('drawer').innerHTML=`
   <div class="eyebrow">Заявка</div>
   <h3>№ ${esc(x.no)}</h3>
   <div class="muted">${esc(x.organization)} · источник: ${esc(x.source||'веб-форма')}</div>
   ${slaBox}
   <div class="sect">Основное</div>
   ${L('Приоритет',bg(x.priority))}${L('Статус',bg(x.status))}
   ${L('Передал',esc(x.employee||'—'))}${L('Исполнитель',esc(x.executor||'—'))}
   ${L('Комментарий',esc(x.comment||'—'))}
   <div class="sect">Организация</div>
   ${L('ИНН',esc(x.inn||'—'))}${L('Контакт',esc(x.contact||'—'))}
   ${L('Телефон',esc(x.phone||'—'))}${L('E-mail',esc(x.email||'—'))}
   <div class="sect">Оборудование</div>
   ${L('Количество ККТ',esc(x.kktCount||'—'))}${L('Модель',esc(x.model||'—'))}
   ${L('РНМ',esc(x.rnm||'—'))}${L('ЗН ККТ',esc(x.zn||'—'))}${L('ФН',esc(x.fn||'—'))}
   <div class="sect">Сопровождение</div>
   ${L('Выезд',esc(x.needTrip||'Нет'))}${L('Адрес',esc(x.tripAddress||'—'))}
   ${L('ЕСП',esc(x.esp||'Нет'))}${L('КЭП',esc(x.kep||'Нет'))}${L('Wi-Fi',esc(x.wifi||'Нет'))}
   <div class="dacts">
     <button class="btn solid" data-d="edit">Редактировать</button>
     <button class="btn" data-d="status">Сменить статус</button>
     ${isAdmin()?'<button class="btn" data-d="transfer">Передать заявку</button>':''}
     ${isAdmin()?'<button class="btn bad" data-d="del">Удалить</button>':''}
   </div>`;
  tick();
}
$('drawer').addEventListener('click',async e=>{
  const b=e.target.closest('[data-d]');if(!b)return;
  const item=S.requests.find(r=>r.id===$('drawer').dataset.key);if(!item)return;
  if(b.dataset.d==='edit')openRequest(item);
  if(b.dataset.d==='status')openStatus(item);
  if(b.dataset.d==='transfer')openTransfer(item);
  if(b.dataset.d==='del'&&confirm('Удалить заявку № '+item.no+'?')){
    try{await call('deleteRequest',{id:item.id});toast('Заявка удалена','ok');go(S.page);}catch(er){toast(er.message);}}
});

/*═════ СОБЫТИЯ КОНТЕНТА ═════*/
$('content').addEventListener('change',e=>{
  const f=e.target.closest('[data-f]');if(!f)return;
  S.filters[f.dataset.f]=f.value;renderRequests();tick();});
$('content').addEventListener('click',async e=>{
  const t=e.target;
  const nav=t.closest('[data-nav]');if(nav)return go(nav.dataset.nav);
  const act=t.closest('[data-act]');
  if(act){const a=act.dataset.act;
    if(a==='soon'){S.filters.risk=S.filters.risk==='soon'?'':'soon';return (renderRequests(),tick());}
    if(a==='over'){S.filters.risk=S.filters.risk==='over'?'':'over';return (renderRequests(),tick());}
    if(a==='clear'){S.filters={status:'',priority:'',exec:'',risk:'',q:''};$('search').value='';return (renderRequests(),tick());}
    if(a==='csv')return exportCSV();
    if(a==='org-new')return openOrg(null);
    if(a==='ex-new')return openExec(null);
    if(a==='user-new')return openUser(null);
    if(a==='ping'){try{const r=await call('ping',{});toast('Соединение доступно · '+(r.mode||'live'),'ok');}catch(er){toast(er.message);}return;}
    if(a==='mail'){const to=prompt('Адрес для теста:',S.settings.mailFrom||'');if(!to)return;
      try{const r=await call('testMail',{to});toast(r.message||'Отправлено','ok');}catch(er){toast(er.message);}return;}}
  const map=[['orgEdit','org-edit',id=>openOrg(S.orgs.find(o=>o.id===id))],
    ['orgReq','org-req',id=>{S.filters.q=(S.orgs.find(o=>o.id===id)||{}).name||'';$('search').value=S.filters.q;go('requests');}],
    ['orgTog','org-tog',async id=>{await call('toggleOrg',{id});go('orgs');}],
    ['orgDel','org-del',async id=>{if(confirm('Удалить организацию?')){await call('deleteOrg',{id});toast('Удалено','ok');go('orgs');}}],
    ['exEdit','ex-edit',id=>openExec(S.execs.find(x=>x.id===id))],
    ['exTog','ex-tog',async id=>{await call('toggleExec',{id});go('execs');}],
    ['exDel','ex-del',async id=>{if(confirm('Удалить исполнителя?')){await call('deleteExec',{id});toast('Удалено','ok');go('execs');}}],
    ['usEdit','us-edit',id=>openUser(S.users.find(u=>u.id===id))],
    ['usTog','us-tog',async id=>{await call('toggleUser',{id});go('users');}],
    ['usDel','us-del',async id=>{if(confirm('Удалить пользователя?')){await call('deleteUser',{id});toast('Удалено','ok');go('users');}}]];
  for(const [prop,attr,fn] of map){
    const el=t.closest('[data-'+attr+']');
    if(el){try{await fn(el.dataset[prop]);}catch(er){toast(er.message);}return;}}
  const ob=t.closest('[data-open]'),tr=t.closest('tr[data-key]');
  const key=ob?ob.dataset.open:(tr?tr.dataset.key:null);if(!key)return;
  const item=S.requests.find(r=>r.id===key);if(!item)return;
  S.selected=key;
  document.querySelectorAll('tr[data-key]').forEach(el=>el.classList.toggle('sel',el.dataset.key===key));
  renderDrawer(item);
  if(ob&&window.innerWidth<=1300)openRequest(item);
});

/*═════ МОДАЛКИ ═════*/
function modal(h){$('modal').classList.remove('hidden');$('modal').innerHTML=h;}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML='';}
$('modal').addEventListener('click',e=>{
  if(e.target===$('modal'))return closeModal();
  if(e.target.closest('[data-m="close"]'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').classList.contains('hidden'))closeModal();});
const opt=(a,c)=>a.map(v=>`<option ${v===c?'selected':''}>${esc(v)}</option>`).join('');
const optId=(a,c)=>`<option value="">— не выбрано —</option>`+a.map(v=>`<option value="${esc(v.id)}" ${v.id===c?'selected':''}>${esc(v.name)}</option>`).join('');
const closeX='<button class="ico" data-m="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>';

     <div class="field"><label>ЕСП</label><select name="esp">${opt(['Нет','Да'],e.esp||'Нет')}</select></div>
     <div class="field"><label>КЭП</label><select name="kep">${opt(['Нет','Да'],e.kep||'Нет')}</select></div>

   </div>

     <button class="btn solid" type="submit" id="rSub">Сохранить</button></div></form></div>`);
  $('rForm').addEventListener('submit',async ev=>{

/*═════ ЭКСПОРТ ═════*/
function exportCSV(){
  const rows=filtered();
  const cols=['no','ts','source','employee','priority','status','executor','organization','inn','contact','phone','email',
    'kktCount','rnm','zn','fn','model','needTrip','tripAddress','esp','kep','wifi','comment'];
  const head=cols.concat(['остаток_SLA']).join(';');
  const body=rows.map(r=>{
    const left=deadline(r)-Date.now();
    const sla=isClosed(r)?'закрыта':(left>=0?dur(left):'просрочено '+dur(-left));
    return cols.map(c=>'"'+String((c==='ts'?fmt(r.ts):r[c])??'').replace(/"/g,'""')+'"').join(';')+';"'+sla+'"';});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+[head].concat(body).join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download='requests_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  toast('Выгружено строк: '+rows.length,'ok');
}

$('search').addEventListener('input',debounce(()=>{
  S.filters.q=$('search').value.trim();
  if(S.page==='requests'){renderRequests();tick();}
  else if(S.page==='orgs')renderOrgs();
  else if(S.page==='log')renderLog();
  else if(S.filters.q)go('requests');
},280));
$('reloadBtn').addEventListener('click',e=>{const b=e.currentTarget;b.classList.add('rot');
  setTimeout(()=>b.classList.remove('rot'),700);go(S.page);});
