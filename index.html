<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFE PAY — CRM</title>
<style>
:root{
 --bg:#e8ebef;--bg2:#f6f8fb;--text:#0c1119;--muted:#68717f;--soft:#8a94a2;
 --line:rgba(12,17,25,.10);--line2:rgba(12,17,25,.05);
 --acc:#111a26;--acc-t:#f8f9fb;--gold:#a9853f;--gold-s:rgba(169,133,63,.14);
 --ok:#2d7a5c;--warn:#a5742a;--bad:#9d2b36;
 /* стекло */
 --g1:rgba(255,255,255,.74);--g2:rgba(255,255,255,.34);
 --g1s:rgba(255,255,255,.52);--g2s:rgba(255,255,255,.2);
 --gloss:rgba(255,255,255,.85);--gloss2:rgba(255,255,255,.35);
 --edge1:rgba(255,255,255,1);--edge2:rgba(255,255,255,.2);
 --sheen:rgba(255,255,255,.55);
 --field:rgba(255,255,255,.58);--head:rgba(12,17,25,.04);
 --sh:0 1px 2px rgba(16,24,40,.05),0 14px 34px rgba(16,24,40,.08);
 --sh2:0 2px 8px rgba(16,24,40,.07),0 34px 74px rgba(16,24,40,.15);
 --blur:26px;--r:16px;
}
html[data-theme=dark]{
 --bg:#070a0e;--bg2:#0d1218;--text:#e8edf4;--muted:#8a96a6;--soft:#6c7988;
 --line:rgba(232,237,244,.12);--line2:rgba(232,237,244,.06);
 --acc:#e8edf4;--acc-t:#0a0e13;--gold:#cbab64;--gold-s:rgba(203,171,100,.16);
 --ok:#4cb98b;--warn:#dcae57;--bad:#df6f79;
 --g1:rgba(34,43,56,.60);--g2:rgba(12,17,24,.38);
 --g1s:rgba(34,43,56,.42);--g2s:rgba(12,17,24,.26);
 --gloss:rgba(255,255,255,.16);--gloss2:rgba(255,255,255,.06);
 --edge1:rgba(255,255,255,.26);--edge2:rgba(255,255,255,.03);
 --sheen:rgba(255,255,255,.2);
 --field:rgba(8,12,17,.42);--head:rgba(232,237,244,.05);
 --sh:0 1px 2px rgba(0,0,0,.45),0 18px 44px rgba(0,0,0,.5);
 --sh2:0 2px 10px rgba(0,0,0,.5),0 38px 80px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden;
 font-family:'Inter','Segoe UI',system-ui,Arial,sans-serif;font-feature-settings:"tnum" 1;
 -webkit-font-smoothing:antialiased;letter-spacing:-.011em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0}
.hidden{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:0;height:0;overflow:hidden}

/*── живая подложка ──*/
#aurora{position:fixed;inset:-12%;z-index:-2;pointer-events:none;filter:url(#liquid)}
#aurora i{position:absolute;display:block;border-radius:50%;filter:blur(64px);opacity:.75;will-change:transform}
#aurora i:nth-child(1){width:46vw;height:46vw;left:-6vw;top:-10vh;
 background:radial-gradient(circle at 35% 35%,var(--gold-s),transparent 70%);animation:fl1 26s ease-in-out infinite}
#aurora i:nth-child(2){width:40vw;height:40vw;right:-8vw;top:-6vh;
 background:radial-gradient(circle at 60% 40%,rgba(104,140,190,.22),transparent 70%);animation:fl2 31s ease-in-out infinite}
#aurora i:nth-child(3){width:52vw;height:52vw;left:28vw;bottom:-28vh;
 background:radial-gradient(circle at 50% 50%,rgba(150,120,190,.15),transparent 70%);animation:fl3 37s ease-in-out infinite}
html[data-theme=dark] #aurora i{opacity:.55}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:linear-gradient(180deg,var(--bg2),var(--bg))}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.3;
 background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);
 background-size:72px 72px;mask-image:radial-gradient(130% 95% at 50% 0%,#000 26%,transparent 76%)}
@keyframes fl1{0%,100%{transform:none}50%{transform:translate3d(8vw,6vh,0) scale(1.12)}}
@keyframes fl2{0%,100%{transform:none}50%{transform:translate3d(-7vw,9vh,0) scale(1.18)}}
@keyframes fl3{0%,100%{transform:none}50%{transform:translate3d(5vw,-8vh,0) scale(.9)}}

/*── ЖИДКОЕ СТЕКЛО ──*/
.glass{position:relative;isolation:isolate;border-radius:var(--r);
 background:linear-gradient(142deg,var(--g1),var(--g2));
 backdrop-filter:blur(var(--blur)) saturate(190%) brightness(1.06);
 -webkit-backdrop-filter:blur(var(--blur)) saturate(190%) brightness(1.06);
 box-shadow:var(--sh),inset 0 1px 0 var(--gloss),inset 0 -1px 0 var(--gloss2);
 transition:box-shadow .45s cubic-bezier(.22,.7,.28,1),transform .45s cubic-bezier(.22,.7,.28,1),background .45s}
.glass:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:4;
 background:linear-gradient(140deg,var(--edge1),transparent 34%,transparent 64%,var(--edge2));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.glass:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;opacity:0;
 background:linear-gradient(104deg,transparent 34%,var(--sheen) 48%,transparent 60%);
 mix-blend-mode:overlay;transform:translateX(-130%)}
.glass:hover:after{opacity:1;animation:sheen 1.15s cubic-bezier(.3,.6,.3,1)}
@keyframes sheen{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
.panel{overflow:hidden}
.panel.card{padding:20px 22px}
.panel:hover{box-shadow:var(--sh2),inset 0 1px 0 var(--gloss),inset 0 -1px 0 var(--gloss2)}
.pane{position:relative;background:linear-gradient(160deg,var(--g1s),var(--g2s));
 backdrop-filter:blur(30px) saturate(175%);-webkit-backdrop-filter:blur(30px) saturate(175%)}

@keyframes up{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes popq{from{opacity:0;transform:translateY(10px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes slideL{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes hair{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@keyframes draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes soft{0%,100%{opacity:1}50%{opacity:.48}}
.anim{animation:up .55s cubic-bezier(.22,.7,.28,1) both}

/*── АНИМАЦИЯ БРЕНДА ──*/
.logo{display:block;width:132px;color:#0c131c;position:relative;overflow:hidden;line-height:0}
html[data-theme=dark] .logo{color:#f2f5f9}
.logo svg{width:100%;height:auto;display:block}
.logo svg>*{animation:brandIn .82s cubic-bezier(.22,.7,.28,1) both}
.logo svg>*:nth-child(1){animation-delay:.04s}
.logo svg>*:nth-child(2){animation-delay:.10s}
.logo svg>*:nth-child(3){animation-delay:.16s}
.logo svg>*:nth-child(4){animation-delay:.22s}
.logo svg>*:nth-child(5){animation-delay:.28s}
.logo svg>*:nth-child(6){animation-delay:.34s}
.logo svg>*:nth-child(7){animation-delay:.40s}
.logo svg>*:nth-child(8){animation-delay:.46s}
.logo svg>*:nth-child(9){animation-delay:.52s}
@keyframes brandIn{from{opacity:0;transform:translateY(9px) scale(.94);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}
.logo:after{content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(100deg,transparent 36%,var(--brandSheen,rgba(255,255,255,.9)) 50%,transparent 64%);
 mix-blend-mode:overlay;transform:translateX(-140%);animation:sheen 2.4s 1.1s cubic-bezier(.3,.6,.3,1) infinite}
html[data-theme=dark] .logo{--brandSheen:rgba(203,171,100,.55)}
.logo.big{width:152px}
.logo.big:before{content:"";position:absolute;inset:-26% -14%;z-index:-1;border-radius:50%;
 background:radial-gradient(closest-side,var(--gold-s),transparent 72%);animation:soft 4.2s ease-in-out infinite}

/*── сплеш бренда ──*/
#boot{position:fixed;inset:0;z-index:99;display:grid;place-items:center;
 background:linear-gradient(180deg,var(--bg2),var(--bg));transition:opacity .6s,visibility .6s}
#boot.off{opacity:0;visibility:hidden}
#boot .bwrap{display:grid;justify-items:center;gap:18px;padding:38px 46px;border-radius:22px;
 background:linear-gradient(142deg,var(--g1),var(--g2));backdrop-filter:blur(30px) saturate(180%);
 box-shadow:var(--sh2),inset 0 1px 0 var(--gloss)}
#boot .bline{width:150px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
#boot .bline i{display:block;height:100%;width:38%;border-radius:2px;
 background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:bmove 1.25s cubic-bezier(.5,0,.4,1) infinite}
@keyframes bmove{from{transform:translateX(-110%)}to{transform:translateX(300%)}}
#boot .btxt{font-size:9.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}

.eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--soft)}
.rule{height:1px;background:var(--line);margin:14px 0;transform-origin:left;animation:hair .7s ease both}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;position:relative;z-index:5}
.head b{font-size:14px;font-weight:650;letter-spacing:-.02em}
.mini{font-size:11px;color:var(--muted)}

/*── тумблер темы ──*/
.tsw{position:relative;width:62px;height:31px;border-radius:999px;flex:none;overflow:hidden;
 background:linear-gradient(142deg,var(--g1),var(--g2));backdrop-filter:blur(16px) saturate(170%);
 box-shadow:inset 0 1px 0 var(--gloss),inset 0 0 0 1px var(--line);transition:box-shadow .35s}
.tsw:hover{box-shadow:inset 0 1px 0 var(--gloss),inset 0 0 0 1px var(--gold)}
.tsw i{position:absolute;top:0;bottom:0;width:31px;display:grid;place-items:center;color:var(--soft);transition:color .35s}
.tsw i svg{width:15px;height:15px;display:block}
.tsw .s{left:0}.tsw .m{right:0}
html[data-theme=light] .tsw .s{color:var(--gold)}
html[data-theme=dark] .tsw .m{color:var(--gold)}
.tsw b{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:var(--acc);
 box-shadow:0 2px 9px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.3);
 transition:transform .46s cubic-bezier(.5,.05,.2,1.25)}
html[data-theme=dark] .tsw b{transform:translateX(31px)}

/*── логин ──*/
#login{min-height:100vh;display:grid;place-items:center;padding:26px}
.login-card{width:min(438px,100%);padding:36px 34px;animation:popq .6s cubic-bezier(.22,.7,.28,1) both}
.login-card h1{font-size:28px;margin:22px 0 6px;font-weight:650;letter-spacing:-.034em}
.login-card p{color:var(--muted);margin:0 0 20px;font-size:13.5px;line-height:1.55}
.field{display:grid;gap:6px;margin:13px 0;position:relative;z-index:5}
.field label{font-size:9.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--soft)}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:0;outline:none;font-size:13.5px;
 background:var(--field);backdrop-filter:blur(14px) saturate(160%);
 box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--gloss2);transition:box-shadow .3s,background .3s}
.field textarea{min-height:78px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{
 box-shadow:inset 0 0 0 1px var(--gold),0 0 0 4px var(--gold-s),inset 0 1px 0 var(--gloss)}
.field input:disabled,.field select:disabled{opacity:.55}
.btn{position:relative;overflow:hidden;border-radius:12px;padding:10px 16px;font-size:12.5px;font-weight:600;
 background:linear-gradient(142deg,var(--g1),var(--g2));backdrop-filter:blur(16px) saturate(170%);
 box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--gloss),0 2px 8px rgba(16,24,40,.06);
 transition:.3s cubic-bezier(.22,.7,.28,1)}
.btn:hover{color:var(--gold);transform:translateY(-1px);
 box-shadow:inset 0 0 0 1px var(--gold),inset 0 1px 0 var(--gloss),0 8px 22px rgba(16,24,40,.12)}
.btn:active{transform:translateY(0) scale(.99)}
.btn.solid{background:linear-gradient(140deg,var(--acc),color-mix(in srgb,var(--acc) 82%,var(--gold)));color:var(--acc-t);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 22px rgba(16,24,40,.22)}
.btn.solid:hover{color:var(--acc-t);filter:brightness(1.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 14px 34px rgba(16,24,40,.3)}
.btn.block{width:100%;padding:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn.bad:hover{color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad),inset 0 1px 0 var(--gloss)}
.err{min-height:18px;color:var(--bad);font-size:12px;margin-top:10px;white-space:pre-wrap}
.note{margin-top:16px;padding:13px 14px;border-radius:12px;font-size:11.5px;color:var(--muted);line-height:1.6;
 background:linear-gradient(142deg,var(--g1s),var(--g2s));backdrop-filter:blur(14px);
 box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--gloss2)}
.note b{color:var(--text)}

/*── каркас ──*/
#app{display:grid;grid-template-columns:242px 1fr 362px;min-height:100vh}
.side{padding:22px 16px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
 box-shadow:inset -1px 0 0 var(--line),inset 1px 0 0 var(--gloss2)}
.side-logo{padding:4px 6px 20px;position:relative}
.side-logo:after{content:"";position:absolute;left:6px;right:6px;bottom:8px;height:1px;
 background:linear-gradient(90deg,var(--gold),transparent);transform-origin:left;animation:hair 1.1s .5s ease both}
.nav{display:grid;gap:17px;overflow:auto;padding-right:2px}
.navlabel{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);
 padding:0 10px 7px;border-bottom:1px solid var(--line2);margin-bottom:5px}
.nav button{position:relative;width:100%;padding:9px 12px;border-radius:10px;text-align:left;font-size:12.8px;
 font-weight:550;color:var(--muted);display:flex;align-items:center;gap:10px;transition:.28s;overflow:hidden}
.nav button svg{width:15px;height:15px;flex:none;opacity:.7;transition:.28s}
.nav button:hover{color:var(--text);background:linear-gradient(142deg,var(--g1s),transparent);
 box-shadow:inset 0 1px 0 var(--gloss2)}
.nav button.active{color:var(--text);font-weight:650;
 background:linear-gradient(142deg,var(--g1),var(--g2s));backdrop-filter:blur(12px);
 box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--gloss)}
.nav button.active:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;
 background:var(--gold);border-radius:0 2px 2px 0;animation:fade .4s both}
.nav button.active svg{opacity:1;color:var(--gold)}
.nav .cnt{margin-left:auto;font-size:10px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.me{margin-top:auto;padding:14px 11px 4px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.ava{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px;
 background:linear-gradient(140deg,var(--acc),color-mix(in srgb,var(--acc) 80%,var(--gold)));color:var(--acc-t);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(16,24,40,.2)}
.me b{font-size:12.5px;display:block;line-height:1.3}
.me span{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--soft)}

.main{padding:20px 24px 30px;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 18px;margin-bottom:14px;animation:up .5s both}
.topbar h2{margin:3px 0 0;font-size:21px;font-weight:650;letter-spacing:-.035em}
.topbar .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.search{margin-left:auto;width:min(292px,28vw);border:0;border-radius:12px;padding:11px 14px;font-size:12.5px;outline:none;
 background:var(--field);backdrop-filter:blur(14px) saturate(160%);
 box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--gloss2);transition:.3s}
.search:focus{box-shadow:inset 0 0 0 1px var(--gold),0 0 0 4px var(--gold-s)}
.ico{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;flex:none;
 background:linear-gradient(142deg,var(--g1),var(--g2));backdrop-filter:blur(16px) saturate(170%);
 box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--gloss);transition:.3s}
.ico svg{width:16px;height:16px}
.ico:hover{color:var(--gold);transform:translateY(-1px);box-shadow:inset 0 0 0 1px var(--gold),inset 0 1px 0 var(--gloss)}
.ico.rot svg{animation:rot .75s cubic-bezier(.5,0,.3,1)}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;letter-spacing:.14em;
 text-transform:uppercase;color:var(--soft);padding:7px 11px;border-radius:999px;
 background:linear-gradient(142deg,var(--g1s),var(--g2s));box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--gloss2)}
.mode i{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:soft 2.6s ease-in-out infinite}

/*── KPI ──*/
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{padding:18px 19px}
.kpi .cap{position:absolute;left:0;right:0;top:0;height:2px;background:transparent;z-index:5}
.kpi.acc .cap{background:linear-gradient(90deg,var(--gold),transparent)}
.kpi.warn .cap{background:linear-gradient(90deg,var(--warn),transparent)}
.kpi.bad .cap{background:linear-gradient(90deg,var(--bad),transparent)}
.kpi b{display:block;font-size:31px;font-weight:600;letter-spacing:-.05em;margin:10px 0 3px;line-height:1}
.kpi .d{font-size:10.5px;color:var(--soft)}
.kpi.acc b{color:var(--gold)}.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}
.kpi:hover{transform:translateY(-3px)}

/*── графики ──*/
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-top:12px}
.spark{width:100%;height:174px;display:block;margin-top:6px;position:relative;z-index:5}
.spark .grid{stroke:var(--line2);stroke-width:1}
.spark .ln{fill:none;stroke:var(--gold);stroke-width:2;vector-effect:non-scaling-stroke;
 stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1400;animation:draw 1.4s cubic-bezier(.3,.7,.3,1) both}
.spark .dot{fill:var(--bg2);stroke:var(--gold);stroke-width:1.6;vector-effect:non-scaling-stroke}
.spark text{fill:var(--soft);font-size:9px;letter-spacing:.06em}
.ringwrap{display:flex;align-items:center;gap:20px;margin-top:8px;position:relative;z-index:5}
.ringwrap svg{flex:none;animation:rise .65s both}
.ringc{font-size:23px;font-weight:600;letter-spacing:-.045em;fill:var(--text)}
.ringl{font-size:8px;letter-spacing:.18em;fill:var(--soft)}
.leg{display:grid;gap:9px;flex:1;min-width:0}
.leg div{display:grid;grid-template-columns:8px 1fr auto auto;align-items:center;gap:9px;font-size:11.5px}
.leg i{width:8px;height:8px;border-radius:2px;box-shadow:0 0 8px currentColor}
.leg span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg b{font-weight:650;font-variant-numeric:tabular-nums}
.leg em{font-style:normal;color:var(--soft);font-size:10px;width:34px;text-align:right}

/*── таблицы ──*/
.tw{position:relative;z-index:5;overflow:auto;border-radius:13px;max-height:60vh;margin-top:14px;
 background:linear-gradient(160deg,var(--g1s),var(--g2s));backdrop-filter:blur(18px) saturate(160%);
 box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--gloss2)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:11px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line2)}
th{position:sticky;top:0;z-index:2;background:linear-gradient(180deg,var(--g1),var(--g2));
 backdrop-filter:blur(20px) saturate(170%);box-shadow:inset 0 -1px 0 var(--line),inset 0 1px 0 var(--gloss);
 font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--soft)}
tbody tr{cursor:pointer;animation:fade .38s both;transition:background .25s,box-shadow .25s}
tbody tr:hover td{background:linear-gradient(90deg,var(--head),transparent)}
tbody tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--line)}
tbody tr.sel td{background:linear-gradient(90deg,var(--gold-s),transparent)}
tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--gold)}
tbody tr:last-child td{border-bottom:0}
.ell{max-width:224px;overflow:hidden;text-overflow:ellipsis}
.empty{padding:48px;text-align:center;color:var(--muted);font-size:12.5px;white-space:pre-wrap;animation:fade .4s both}
.skel{height:12px;border-radius:7px;margin:15px 0;background:linear-gradient(90deg,var(--head),var(--gloss),var(--head));
 background-size:200% 100%;animation:sk 1.25s linear infinite}
.no{font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/*── индикаторы ──*/
.bg{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;padding:3px 10px 3px 8px;
 border-radius:8px;color:var(--muted);background:linear-gradient(142deg,var(--g1),var(--g2));
 backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--gloss2)}
.bg:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none;box-shadow:0 0 7px currentColor}
.bg.n{color:var(--text)}.bg.w{color:var(--gold)}.bg.h{color:var(--warn)}
.bg.d{color:var(--ok)}.bg.x{color:var(--bad)}.bg.o{opacity:.62}
.pri{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:550}
.pri i{display:flex;gap:2px}
.pri i s{width:3px;height:10px;border-radius:1px;background:var(--line);text-decoration:none}
.pri i s.on{background:currentColor;box-shadow:0 0 6px currentColor}
.pri.p1{color:var(--ok)}.pri.p2{color:var(--muted)}.pri.p3{color:var(--warn)}.pri.p4{color:var(--bad)}

/*── таймер SLA ──*/
.tv{font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--ok)}
.tv.warn{color:var(--warn)}
.tv.bad{color:var(--bad);animation:soft 2s ease-in-out infinite}
.tv.done{color:var(--soft);font-weight:500}
.tcell{min-width:138px}
.track{height:5px;border-radius:5px;background:var(--head);overflow:hidden;margin-top:6px;width:126px;
 box-shadow:inset 0 0 0 1px var(--line2)}
.track i{display:block;height:100%;border-radius:5px;background:var(--ok);
 box-shadow:0 0 10px currentColor;transition:width .9s cubic-bezier(.22,.7,.28,1)}
.track i.warn{background:var(--warn)}.track i.bad{background:var(--bad)}.track i.ok{background:var(--ok)}
.track.wide{width:100%}
.sla-box{margin-top:16px;padding:17px;border-radius:14px;position:relative;
 background:linear-gradient(142deg,var(--g1),var(--g2));backdrop-filter:blur(18px) saturate(170%);
 box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--gloss)}
.sla-box .big{font-size:30px;font-weight:600;letter-spacing:-.045em;margin:8px 0 12px;font-variant-numeric:tabular-nums}
.sla-box .big.warn{color:var(--warn)}.sla-box .big.bad{color:var(--bad)}.sla-box .big.ok{color:var(--ok)}
.sla-meta{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--soft);margin-top:9px}

/*── фильтры ──*/
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px;align-items:center;position:relative;z-index:5}
.filters select{border:0;border-radius:10px;padding:8px 11px;font-size:12px;outline:none;background:var(--field);
 backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--gloss2)}
.filters select:focus{box-shadow:inset 0 0 0 1px var(--gold),0 0 0 4px var(--gold-s)}
.seg{display:inline-flex;border-radius:10px;overflow:hidden;background:linear-gradient(142deg,var(--g1s),var(--g2s));
 backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--gloss2)}
.seg button{padding:8px 13px;font-size:11.5px;font-weight:600;color:var(--muted);transition:.25s}
.seg button:hover{color:var(--text);background:var(--head)}
.seg button.on{background:linear-gradient(140deg,var(--acc),color-mix(in srgb,var(--acc) 80%,var(--gold)));color:var(--acc-t);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.act{border-radius:9px;padding:5px 10px;font-size:10.5px;font-weight:600;color:var(--muted);transition:.25s;
 background:linear-gradient(142deg,var(--g1s),var(--g2s));backdrop-filter:blur(10px);
 box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--gloss2)}
.act:hover{color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold),inset 0 1px 0 var(--gloss2)}
.act.bad:hover{color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.acts{display:flex;gap:5px}

/*── дровер ──*/
.drawer{padding:20px 20px 32px;position:sticky;top:0;height:100vh;overflow:auto;
 box-shadow:inset 1px 0 0 var(--line),inset -1px 0 0 var(--gloss2)}
.drawer>*{animation:slideL .42s both}
.drawer h3{margin:5px 0 3px;font-size:19px;font-weight:650;letter-spacing:-.035em}
.drawer .muted{font-size:11.5px;color:var(--muted)}
.sect{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);
 margin:20px 0 9px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px 1fr;gap:9px;padding:5px 0;font-size:12px;align-items:start}
.row>span{color:var(--soft)}
.row>b{font-weight:600;word-break:break-word;white-space:pre-wrap}
.tl{position:relative;padding-left:20px;margin-top:4px}
.tl:before{content:"";position:absolute;left:4px;top:9px;bottom:11px;width:1px;background:var(--line)}
.tl .st{position:relative;padding:6px 0;font-size:12px;font-weight:600}
.tl .st:before{content:"";position:absolute;left:-20px;top:10px;width:9px;height:9px;border-radius:50%;
 background:var(--bg);box-sizing:border-box;box-shadow:inset 0 0 0 1.5px var(--line)}
.tl .st.on:before{background:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold),0 0 9px var(--gold-s)}
.tl .st.now:before{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--gold),0 0 0 4px var(--gold-s)}
.tl .st em{display:block;font-style:normal;font-size:10.5px;font-weight:400;color:var(--soft);margin-top:1px}
.dacts{display:grid;gap:8px;margin-top:20px}

/*── модалка ──*/
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;
 background:rgba(6,9,13,.46);backdrop-filter:blur(14px) saturate(120%);animation:fade .24s both}
.mcard{width:min(880px,100%);max-height:92vh;overflow:auto;padding:0;
 animation:popq .36s cubic-bezier(.22,.7,.28,1) both}
.mbody{padding:22px 24px;position:relative;z-index:5}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px 14px;
 position:sticky;top:0;z-index:6;border-radius:var(--r) var(--r) 0 0;
 background:linear-gradient(180deg,var(--g1),var(--g2));backdrop-filter:blur(26px) saturate(180%);
 box-shadow:inset 0 -1px 0 var(--line),inset 0 1px 0 var(--gloss)}
.mhead h3{margin:3px 0 0;font-size:18px;font-weight:650;letter-spacing:-.03em}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.macts{display:flex;justify-content:flex-end;gap:9px;padding:14px 24px 20px;position:sticky;bottom:0;z-index:6;
 background:linear-gradient(0deg,var(--g1),var(--g2));backdrop-filter:blur(26px) saturate(180%);
 box-shadow:inset 0 1px 0 var(--line)}

#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:9px;z-index:80;max-width:344px}
.toast{padding:13px 15px;border-radius:13px;font-size:12px;line-height:1.5;white-space:pre-wrap;
 background:linear-gradient(142deg,var(--g1),var(--g2));backdrop-filter:blur(24px) saturate(180%);
 box-shadow:var(--sh2),inset 0 0 0 1px var(--line),inset 0 1px 0 var(--gloss);
 border-left:2px solid var(--muted);animation:up .34s cubic-bezier(.22,.7,.28,1);transition:opacity .3s,transform .3s}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--bad)}.toast.info{border-left-color:var(--gold)}

@media(max-width:1320px){#app{grid-template-columns:220px 1fr}.drawer{display:none}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:880px){
 #app{grid-template-columns:1fr}.side{position:relative;height:auto}
 .nav{gap:10px}.main{padding:14px}.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}
 .search{display:none}.fgrid{grid-template-columns:1fr}#aurora i{filter:blur(48px)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<script>
'use strict';
/*═════ КОНФИГ ═════*/
const CFG={API:'',TIMEOUT:25000,SLA_HOURS:60,WARN_HOURS:6,SIMULATE_INTAKE:true,INTAKE_EVERY:60000};
const API_RE=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(\?.*)?$/;
const LIVE=API_RE.test(CFG.API.trim());

/*═════ ЛОГОТИП ═════*/
const LOGO=`<svg viewBox="0 0 142.001 23.585" fill="none" xmlns="http://www.w3.org/2000/svg">

<path fill-rule="evenodd" clip-rule="evenodd" d="M111.241 0.125808C116.184 0.188434 120.195 4.11802 120.389 9.02858H120.396V18.5862H117.417V16.21C115.763 17.7395 113.552 18.6745 111.121 18.6745L111.001 18.6737C105.974 18.61 101.911 14.5468 101.847 9.51965L101.847 9.3998C101.847 4.27751 105.999 0.125014 111.121 0.125001L111.241 0.125808ZM111.121 3.10398C107.644 3.10399 104.826 5.92279 104.826 9.3998C104.826 12.8768 107.644 15.6955 111.121 15.6955C114.598 15.6955 117.417 12.8768 117.417 9.3998C117.417 5.9228 114.598 3.10401 111.121 3.10398Z" fill="currentColor"/>

<path d="M128.72 6.20621C128.72 9.05103 131.025 11.3573 133.87 11.3576C136.715 11.3576 139.021 9.05117 139.021 6.20621V0.000155866H142.001V6.20621L142 6.31168C141.944 10.7534 138.325 14.3371 133.87 14.3371C129.415 14.3368 125.797 10.7533 125.741 6.31168L125.74 6.20621V0.000155866H128.72V6.20621Z" fill="currentColor"/>
<path d="M56.3798 0.000155866C61.502 0.000155866 65.655 4.15242 65.6552 9.27457C65.6552 9.77205 65.6134 10.3227 65.538 10.799H65.3485V10.8H50.2724C50.9543 13.5397 53.429 15.5703 56.3798 15.5705C58.1447 15.5705 59.7406 14.8439 60.8837 13.674L63.8056 14.8332C62.1138 17.0895 59.417 18.55 56.3798 18.55C51.2576 18.5498 47.1054 14.3968 47.1054 9.27457C47.1055 4.15253 51.2577 0.000333086 56.3798 0.000155866ZM56.3798 2.97965C53.4037 2.9798 50.9124 5.04505 50.2558 7.82047H62.5048C61.8482 5.04491 59.356 2.97965 56.3798 2.97965Z" fill="currentColor"/>
<path d="M37.4865 0.000155866C40.5444 0.000185923 43.2109 1.67553 44.6184 4.15836L41.7073 5.13102C40.7597 3.82692 39.2219 2.97967 37.4865 2.97965C34.7325 2.97965 32.4782 5.11493 32.2873 7.82047H39.8459V10.799H32.2727V18.6193H29.2942V8.19254C29.2942 3.66804 32.962 0.000155866 37.4865 0.000155866Z" fill="currentColor"/>
<path d="M128.967 15.6405C128.967 16.2742 129.093 16.902 129.339 17.4883C129.584 18.0746 129.944 18.6083 130.398 19.0585C130.853 19.5087 131.393 19.8666 131.989 20.111C132.585 20.3554 133.224 20.4814 133.87 20.4814C134.516 20.4814 135.155 20.3554 135.751 20.111C136.347 19.8666 136.888 19.5087 137.342 19.0585C137.797 18.6083 138.157 18.0746 138.402 17.4883C138.647 16.902 138.773 16.2742 138.773 15.6405H141.752C141.752 16.6695 141.548 17.6881 141.15 18.6379C140.753 19.5877 140.171 20.4497 139.439 21.1752C138.706 21.9006 137.837 22.4754 136.882 22.8672C135.927 23.259 134.903 23.4605 133.87 23.4605C132.837 23.4605 131.814 23.259 130.859 22.8672C129.903 22.4754 129.035 21.9006 128.302 21.1752C127.569 20.4497 126.988 19.5877 126.59 18.6379C126.193 17.6881 125.988 16.6695 125.988 15.6405H128.967Z" fill="currentColor"/></svg>`;
const paintLogos=()=>document.querySelectorAll('[data-logo]').forEach(el=>{if(!el.firstChild)el.innerHTML=LOGO;});
paintLogos();

/*═════ УТИЛИТЫ ═════*/
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const H=36e5;
function fmt(v){if(!v)return '—';const d=new Date(v);if(isNaN(d))return esc(v);
  return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});}
const pad=n=>String(n).padStart(2,'0');
function dur(ms){ms=Math.max(0,ms);
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
  return d>0?(d+' д '+pad(h)+':'+pad(m)):(pad(h)+':'+pad(m)+':'+pad(s));}
const durShort=ms=>Math.floor(ms/36e5)+' ч '+pad(Math.floor(ms%36e5/6e4))+' м';
const deadline=r=>new Date(r.ts).getTime()+CFG.SLA_HOURS*H;
const CLOSED=['Выполнено','Отменено'];
const isClosed=r=>CLOSED.includes(r.status);
const overdue=r=>!isClosed(r)&&Date.now()>deadline(r);
const lvl=l=>l<0?'bad':(l<CFG.WARN_HOURS*H?'warn':'ok');
function countUp(el,to){let s=null;const dr=700;
  requestAnimationFrame(function st(t){if(!s)s=t;const p=Math.min(1,(t-s)/dr);
    el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st);});}
function debounce(f,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms);};}

/*═════ СПЛЕШ БРЕНДА ═════*/
const boot=$('boot');
function bootOff(){boot.classList.add('off');}
function bootOn(){boot.classList.remove('off');}

/*═════ ТАЙМЕР SLA ═════*/
function timerCell(r){
  if(isClosed(r)){
    const sp=new Date(r.doneAt||r.updatedAt||r.ts).getTime()-new Date(r.ts).getTime();
    const ok=sp<=CFG.SLA_HOURS*H;
    return `<div class="tcell"><span class="tv done">${durShort(sp)} · ${ok?'в срок':'нарушение'}</span>
      <div class="track"><i class="${ok?'ok':'bad'}" style="width:${Math.min(100,sp/(CFG.SLA_HOURS*H)*100)}%"></i></div></div>`;}
  const st=new Date(r.ts).getTime(),dl=deadline(r);
  return `<div class="tcell"><span class="tv" data-dl="${dl}" data-st="${st}">—</span>
    <div class="track"><i data-role="fill" data-dl="${dl}" data-st="${st}" style="width:0"></i></div></div>`;
}
function tick(){
  const now=Date.now();
  document.querySelectorAll('[data-dl]').forEach(el=>{

async function call(action,payload){
  if(!LIVE) return CORE.call(action,payload||{});
  const c=new AbortController(),t=setTimeout(()=>c.abort(),CFG.TIMEOUT);
  let raw;
  try{
    const res=await fetch(CFG.API,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,payload:payload||{},token:S.token}),signal:c.signal});
    raw=(await res.text()).trim();
  }catch(e){clearTimeout(t);
    throw new Error(e.name==='AbortError'?'Сервер не ответил за '+(CFG.TIMEOUT/1000)+' с':'Нет связи с сервером');}
  clearTimeout(t);
  if(raw.startsWith('<')) throw new Error('Веб-приложение закрыто. Разверните Apps Script с доступом «Все».');
  let d;try{d=raw?JSON.parse(raw):{};}catch{throw new Error('Некорректный ответ сервера');}
  if(d.code===401){forceLogout();throw new Error(d.error||'Сессия истекла');}
  if(d.ok===false) throw new Error(d.error||'Ошибка сервера');
  return d.result!==undefined?d.result:d;
}

/*═════ ГРАФИКА ═════*/
function sparkline(points){
  const W=560,Ht=174,padL=10,padR=10,top=16,bottom=30;
  const max=Math.max(1,...points.map(p=>p.n));
  const n=points.length,step=n>1?(W-padL-padR)/(n-1):0;
  const X=i=>padL+i*step, Y=v=>Ht-bottom-(v/max)*(Ht-top-bottom);
  let d='M'+X(0)+' '+Y(points[0].n);
  for(let i=1;i<n;i++){const cx=(X(i-1)+X(i))/2;
    d+=` C${cx} ${Y(points[i-1].n)},${cx} ${Y(points[i].n)},${X(i)} ${Y(points[i].n)}`;}
  const area=d+` L${X(n-1)} ${Ht-bottom} L${X(0)} ${Ht-bottom} Z`;
  const grid=[0,.5,1].map(k=>`<line class="grid" x1="0" y1="${top+k*(Ht-top-bottom)}" x2="${W}" y2="${top+k*(Ht-top-bottom)}"/>`).join('');
  const dots=points.map((p,i)=>`<circle class="dot" cx="${X(i)}" cy="${Y(p.n)}" r="3"><title>${p.n}</title></circle>`).join('');
  const labels=points.map((p,i)=>`<text x="${X(i)}" y="${Ht-10}" text-anchor="middle">${new Date(p.d).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})}</text>`).join('');
  const vals=points.map((p,i)=>`<text x="${X(i)}" y="${Y(p.n)-9}" text-anchor="middle" style="font-size:9.5px;fill:var(--muted)">${p.n}</text>`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${Ht}" preserveAspectRatio="none">
    <defs><linearGradient id="gA" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="var(--gold)" stop-opacity=".3"/>
      <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#gA)"/><path class="ln" d="${d}"/>${dots}${vals}${labels}</svg>`;
}
function ringChart(parts,total){
  const R=52,C=2*Math.PI*R;let off=0;
  const arcs=parts.map(p=>{const len=total?p.n/total*C:0;
    const s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${p.c}" stroke-width="13" stroke-linecap="butt"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 70 70)"/>`;off+=len;return s;}).join('');
  return `<svg width="140" height="140" viewBox="0 0 140 140">
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--head)" stroke-width="13"/>
    ${arcs}<text class="ringc" x="70" y="70" text-anchor="middle">${total}</text>
    <text class="ringl" x="70" y="86" text-anchor="middle">ЗАЯВОК</text></svg>`;
}

        <div class="note">Приём заявок с сайта выполняется действием <b>intake</b> без авторизации. Запрос уходит только на адрес вида <b>script.google.com/macros/s/.../exec</b>.</div>
      </div>
    </div></div>`;
  $('setForm').addEventListener('submit',async ev=>{
    ev.preventDefault();
    const p=Object.fromEntries(new FormData(ev.target).entries());
    p.notifyOrg=!!p.notifyOrg;p.notifyExec=!!p.notifyExec;
    p.slaHours=Number(p.slaHours)||60;p.warnHours=Number(p.warnHours)||6;
    try{await call('saveSettings',p);toast('Настройки сохранены','ok');go('settings');}
    catch(e){$('setErr').textContent=e.message;}});
}

/*═════ КАРТОЧКА ═════*/
function renderDrawer(x){
  if(!x){$('drawer').innerHTML='<div class="eyebrow">Карточка</div><h3>Заявка не выбрана</h3><div class="muted">Выберите строку в таблице.</div>';return;}
  $('drawer').dataset.key=x.id;
  const L=(a,b)=>`<div class="row"><span>${a}</span><b>${b}</b></div>`;
  const st=new Date(x.ts).getTime(),dl=deadline(x),closed=isClosed(x);
  const sla=closed
    ? (()=>{const sp=new Date(x.doneAt||x.updatedAt||x.ts).getTime()-st,ok=sp<=CFG.SLA_HOURS*H;
        return `<div class="sla-box"><div class="eyebrow">Заявка закрыта</div>
          <div class="big ${ok?'ok':'bad'}">${durShort(sp)}</div>
          <div class="track wide"><i class="${ok?'ok':'bad'}" style="width:${Math.min(100,sp/(CFG.SLA_HOURS*H)*100)}%"></i></div>
          <div class="sla-meta"><span>Принята ${fmt(x.ts)}</span><span>${ok?'В срок':'С нарушением SLA'}</span></div></div>`;})()
    : `<div class="sla-box"><div class="eyebrow">Остаток времени на выполнение</div>
        <div class="big" data-dl="${dl}" data-st="${st}">—</div>
        <div class="track wide"><i data-role="fill" data-dl="${dl}" data-st="${st}" style="width:0"></i></div>
        <div class="sla-meta"><span>Принята ${fmt(x.ts)}</span><span>Крайний срок ${fmt(dl)}</span></div></div>`;
  const steps=[
    {t:'Заявка поступила',d:fmt(x.ts)+' · '+(x.source||'веб-форма'),on:true},
    {t:'Исполнитель назначен',d:x.executorId?x.executor:'ожидает назначения',on:!!x.executorId},
    {t:'В работе',d:x.status==='В работе'?'выполняется':(closed?'пройден':'не начата'),on:x.status==='В работе'||closed},
    {t:closed?(x.status==='Отменено'?'Отменена':'Выполнена'):'Закрытие',
     d:closed?fmt(x.doneAt||x.updatedAt||x.ts):'до '+fmt(dl),on:closed}];
  const curStep=steps.filter(s=>s.on).length-1;
  $('drawer').innerHTML=`
   <div class="eyebrow">Заявка</div>
   <h3>№ ${esc(x.no)}</h3>
   <div class="muted">${esc(x.organization)}</div>
   ${sla}
   <div class="sect">Жизненный цикл</div>
   <div class="tl">${steps.map((s,i)=>`<div class="st ${s.on?'on':''} ${i===curStep&&!closed?'now':''}">${esc(s.t)}<em>${esc(s.d)}</em></div>`).join('')}</div>
   <div class="sect">Основное</div>
   ${L('Приоритет',pri(x.priority))}${L('Статус',bg(x.status))}
   ${L('Передал',esc(x.employee||'—'))}${L('Исполнитель',esc(x.executor||'—'))}
   ${L('Комментарий',esc(x.comment||'—'))}
   <div class="sect">Организация</div>
   ${L('ИНН',esc(x.inn||'—'))}${L('Контакт',esc(x.contact||'—'))}
   ${L('Телефон',esc(x.phone||'—'))}${L('E-mail',esc(x.email||'—'))}
   <div class="sect">Оборудование</div>
   ${L('Количество ККТ',esc(x.kktCount||'—'))}${L('Модель',esc(x.model||'—'))}
   ${L('РНМ',esc(x.rnm||'—'))}${L('ЗН ККТ',esc(x.zn||'—'))}${L('ФН',esc(x.fn||'—'))}
   <div class="sect">Сопровождение</div>
   ${L('Выезд',esc(x.needTrip||'Нет'))}${L('Адрес',esc(x.tripAddress||'—'))}
   ${L('ЕСП',esc(x.esp||'Нет'))}${L('КЭП',esc(x.kep||'Нет'))}${L('Wi-Fi',esc(x.wifi||'Нет'))}
   <div class="dacts">
     <button class="btn solid" data-d="edit">Редактировать</button>
     <button class="btn" data-d="status">Сменить статус</button>
     ${isAdmin()?'<button class="btn" data-d="transfer">Передать заявку</button>':''}
     ${isAdmin()?'<button class="btn bad" data-d="del">Удалить</button>':''}
   </div>`;
  tick();
}
$('drawer').addEventListener('click',async e=>{
  const b=e.target.closest('[data-d]');if(!b)return;
  const item=S.requests.find(r=>r.id===$('drawer').dataset.key);if(!item)return;
  if(b.dataset.d==='edit')openRequest(item);
  if(b.dataset.d==='status')openStatus(item);
  if(b.dataset.d==='transfer')openTransfer(item);
  if(b.dataset.d==='del'&&confirm('Удалить заявку № '+item.no+'?')){
    try{await call('deleteRequest',{id:item.id});toast('Заявка удалена','ok');go(S.page);}catch(er){toast(er.message);}}
});

/*═════ СОБЫТИЯ ═════*/
$('content').addEventListener('change',e=>{
  const f=e.target.closest('[data-f]');if(!f)return;
  S.filters[f.dataset.f]=f.value;renderRequests();tick();});
$('content').addEventListener('click',async e=>{
  const t=e.target;
  const nav=t.closest('[data-nav]');if(nav)return go(nav.dataset.nav);
  const act=t.closest('[data-act]');
  if(act){const a=act.dataset.act;
    if(['all','open','soon','over'].includes(a)){S.filters.risk=a==='all'?'':a;renderRequests();tick();return;}
    if(a==='clear'){S.filters={status:'',priority:'',exec:'',risk:'',q:''};$('search').value='';renderRequests();tick();return;}
    if(a==='org-new')return openOrg(null);
    if(a==='ex-new')return openExec(null);
    if(a==='user-new')return openUser(null);
    if(a==='ping'){try{const r=await call('ping',{});toast('Соединение доступно · '+(r.mode||'live'),'ok');}catch(er){toast(er.message);}return;}
    if(a==='mail'){const to=prompt('Адрес для теста:',S.settings.mailFrom||'');if(!to)return;
      try{const r=await call('testMail',{to});toast(r.message||'Отправлено','ok');}catch(er){toast(er.message);}return;}}
  const map=[['orgEdit','org-edit',id=>openOrg(S.orgs.find(o=>o.id===id))],
    ['orgReq','org-req',id=>{S.filters.q=(S.orgs.find(o=>o.id===id)||{}).name||'';$('search').value=S.filters.q;go('requests');}],
    ['orgTog','org-tog',async id=>{await call('toggleOrg',{id});go('orgs');}],
    ['orgDel','org-del',async id=>{if(confirm('Удалить организацию?')){await call('deleteOrg',{id});toast('Удалено','ok');go('orgs');}}],
    ['exEdit','ex-edit',id=>openExec(S.execs.find(x=>x.id===id))],
    ['exTog','ex-tog',async id=>{await call('toggleExec',{id});go('execs');}],
    ['exDel','ex-del',async id=>{if(confirm('Удалить исполнителя?')){await call('deleteExec',{id});toast('Удалено','ok');go('execs');}}],
    ['usEdit','us-edit',id=>openUser(S.users.find(u=>u.id===id))],
    ['usTog','us-tog',async id=>{await call('toggleUser',{id});go('users');}],
    ['usDel','us-del',async id=>{if(confirm('Удалить пользователя?')){await call('deleteUser',{id});toast('Удалено','ok');go('users');}}]];
  for(const [prop,attr,fn] of map){
    const el=t.closest('[data-'+attr+']');
    if(el){try{await fn(el.dataset[prop]);}catch(er){toast(er.message);}return;}}
  const ob=t.closest('[data-open]'),tr=t.closest('tr[data-key]');
  const key=ob?ob.dataset.open:(tr?tr.dataset.key:null);if(!key)return;
  const item=S.requests.find(r=>r.id===key);if(!item)return;
  S.selected=key;
  document.querySelectorAll('tr[data-key]').forEach(el=>el.classList.toggle('sel',el.dataset.key===key));
  renderDrawer(item);
  if(ob&&window.innerWidth<=1320)openRequest(item);
});

/*═════ МОДАЛКИ ═════*/
const modal=h=>{$('modal').classList.remove('hidden');$('modal').innerHTML=h;};
const closeModal=()=>{$('modal').classList.add('hidden');$('modal').innerHTML='';};
$('modal').addEventListener('click',e=>{
  if(e.target===$('modal'))return closeModal();
  if(e.target.closest('[data-m="close"]'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').classList.contains('hidden'))closeModal();});
const opt=(a,c)=>a.map(v=>`<option ${v===c?'selected':''}>${esc(v)}</option>`).join('');
const optId=(a,c)=>`<option value="">— не выбрано —</option>`+a.map(v=>`<option value="${esc(v.id)}" ${v.id===c?'selected':''}>${esc(v.name)}</option>`).join('');
const closeX='<button class="ico" data-m="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>';
const mh=(kick,title)=>`<div class="mhead"><div><div class="eyebrow">${kick}</div><h3>${title}</h3></div>${closeX}</div>`;

   <div class="mbody"><input type="hidden" name="id" value="${esc(e.id||'')}">
   <div class="fgrid">
     <div class="field"><label>Поступила</label><input value="${fmt(e.ts)}" disabled></div>
     <div class="field"><label>Источник</label><input value="${esc(e.source||'Веб-форма')}" disabled></div>
     <div class="field"><label>Организация</label><input name="organization" list="orgL" value="${esc(e.organization||'')}" ${adm?'':'disabled'}>
       <datalist id="orgL">${S.orgs.map(o=>`<option value="${esc(o.name)}">`).join('')}</datalist></div>
     <div class="field"><label>ИНН</label><input name="inn" maxlength="12" value="${esc(e.inn||'')}" ${adm?'':'disabled'}></div>
     <div class="field"><label>Контактное лицо</label><input name="contact" value="${esc(e.contact||'')}" ${adm?'':'disabled'}></div>
     <div class="field"><label>Телефон</label><input name="phone" value="${esc(e.phone||'')}" ${adm?'':'disabled'}></div>
     <div class="field"><label>Передал</label><input name="employee" value="${esc(e.employee||'')}"></div>
     <div class="field"><label>Приоритет</label><select name="priority">${opt(['Низкий','Средний','Высокий','Критический'],e.priority||'Средний')}</select></div>
     <div class="field"><label>Статус</label><select name="status">${opt(['Новая','В работе','Ожидание','Выполнено','Отменено'],e.status)}</select></div>
     <div class="field"><label>Исполнитель</label><select name="executorId" ${adm?'':'disabled'}>${optId(S.execs,e.executorId)}</select></div>
     <div class="field"><label>Количество ККТ</label><input name="kktCount" type="number" min="1" value="${esc(e.kktCount||1)}"></div>
     <div class="field"><label>Модель</label><input name="model" value="${esc(e.model||'')}"></div>
     <div class="field"><label>РНМ</label><input name="rnm" value="${esc(e.rnm||'')}"></div>
     <div class="field"><label>ЗН ККТ</label><input name="zn" value="${esc(e.zn||'')}"></div>
     <div class="field"><label>ФН</label><input name="fn" value="${esc(e.fn||'')}"></div>
     <div class="field"><label>Выезд</label><select name="needTrip">${opt(['Нет','Да'],e.needTrip||'Нет')}</select></div>
     <div class="field"><label>Адрес выезда</label><input name="tripAddress" value="${esc(e.tripAddress||'')}"></div>
     <div class="field"><label>ЕСП</label><select name="esp">${opt(['Нет','Да'],e.esp||'Нет')}</select></div>
     <div class="field"><label>КЭП</label><select name="kep">${opt(['Нет','Да'],e.kep||'Нет')}</select></div>
     <div class="field"><label>Wi-Fi</label><select name="wifi">${opt(['Нет','Да'],e.wifi||'Нет')}</select></div>
     <div class="field full"><label>Комментарий</label><textarea name="comment">${esc(e.comment||'')}</textarea></div>
   </div><div class="err" id="rErr"></div></div>
   <div class="macts"><button class="btn" type="button" data-m="close">Отмена</button>
     <button class="btn solid" type="submit" id="rSub">Сохранить</button></div></form></div>`);
  $('rForm').addEventListener('submit',async ev=>{
    ev.preventDefault();
    const p=Object.fromEntries(new FormData(ev.target).entries());
    $('rErr').textContent='';$('rSub').disabled=true;$('rSub').textContent='Сохранение…';
    try{await call('saveRequest',p);closeModal();toast('Изменения сохранены','ok');await go(S.page);}
    catch(err){if($('rErr'))$('rErr').textContent=err.message;}
    finally{if($('rSub')){$('rSub').disabled=false;$('rSub').textContent='Сохранить';}}});
}
function openStatus(x){

   ${mh('Статус','Заявка № '+esc(x.no))}
   <div class="mbody">
     <div class="field"><label>Новый статус</label><select name="status">${opt(['Новая','В работе','Ожидание','Выполнено','Отменено'],x.status)}</select></div>
     <div class="field"><label>Комментарий</label><textarea name="comment">${esc(x.comment||'')}</textarea></div>
     <div class="note">При переводе в «Выполнено» или «Отменено» таймер SLA останавливается, фиксируется фактическое время выполнения.</div>
     <div class="err" id="sErr"></div></div>
   <div class="macts"><button class="btn" type="button" data-m="close">Отмена</button>

/*═════ ШАПКА ═════*/
$('search').addEventListener('input',debounce(()=>{
  S.filters.q=$('search').value.trim();
  if(S.page==='requests'){renderRequests();tick();}
  else if(S.page==='orgs')renderOrgs();

  setTimeout(()=>b.classList.remove('rot'),740);go(S.page);});
$('logoutBtn').addEventListener('click',logout);

/*═════ АВТОПРИЁМ ═════*/
if(!LIVE&&CFG.SIMULATE_INTAKE){
  setInterval(()=>{
    if(!S.me)return;
    const r=CORE.randomIntake();
    toast('Поступила заявка № '+r.no+'\n'+r.organization+' · '+r.priority,'info');
    if(!S.busy&&$('modal').classList.contains('hidden')&&['dashboard','requests'].includes(S.page))go(S.page);
  },CFG.INTAKE_EVERY);
}
if(LIVE){setInterval(()=>{if(S.me&&!S.busy&&$('modal').classList.contains('hidden')&&
  ['dashboard','requests'].includes(S.page))go(S.page);},90000);}

/*═════ СТАРТ ═════*/
(async()=>{
  const finish=()=>setTimeout(bootOff,1150);
  if(!S.token){$('login').classList.remove('hidden');paintLogos();finish();return;}
  try{S.me={};showApp();await go('dashboard');}catch{forceLogout();}
  paintLogos();finish();
})();
</script>
